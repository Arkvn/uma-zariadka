  intro(c, 'Таблица Шульте', `Нажимайте числа по порядку — от 1 до ${N}. Старайтесь смотреть в центр таблицы и находить числа боковым зрением. Время показывается, но не торопит.`, () => {
    const nums = shuffled(Array.from({ length: N }, (_, i) => i + 1), c.rng); let next = 1; const t0 = Date.now();
    stage(c, `<div class="sub" style="margin-top:.7rem">Найдите: <b id="nx" style="font-size:1.3rem;color:var(--acc)">1</b> · <span id="tm">0</span> с</div><div class="grid" style="grid-template-columns:repeat(${n},1fr)">${nums.map(v => `<button data-v="${v}">${v}</button>`).join('')}</div>`);
    every(500, () => { const el = $('#tm'); if (el) el.textContent = Math.round((Date.now() - t0) / 1000); });
    $('.grid').onclick = e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (+b.dataset.v !== next) { b.classList.add('bad'); later(300, () => b.classList.remove('bad')); return; }
      b.disabled = true; b.classList.add('done'); next++; const nx = $('#nx'); if (nx) nx.textContent = Math.min(next, N);
      if (next > N) {
        clearTimers(); const sec = Math.round((Date.now() - t0) / 1000), k = 'sch' + n, rec = !BEST[k] || sec < BEST[k]; if (rec) BEST[k] = sec;
        let up = ''; if (n === 4 && sec <= 35) { BEST.schN = 5; up = ' В следующий раз таблица будет 5 × 5.'; } else if (n === 5 && sec > 120) BEST.schN = 4; saveBest();
        finish(c, `${sec} с${rec ? ' — ваш лучший результат' : ` (лучший: ${BEST[k]} с)`}.${up}`, { value: `${n}×${n}: ${sec} с`, ok: 1, total: 1 }, done);
      }
    };
  });
};

/* ---------- 3. Внимание: корректурная проба ---------- */
U.proof = (c, done) => {
  const L = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ', T = pick('КНРСТВМ', c.rng), cols = 8, rows = 8, N = cols * rows;
  const cells = Array.from({ length: N }, () => { let ch; do ch = L[Math.floor(c.rng() * L.length)]; while (ch === T); return ch; });
  const pos = shuffled(Array.from({ length: N }, (_, i) => i), c.rng).slice(0, 10 + Math.floor(c.rng() * 4)); pos.forEach(i => cells[i] = T);
  intro(c, 'Корректурная проба', `Найдите и отметьте все буквы <b style="font-size:1.3rem;color:var(--acc)">${T}</b>. Просматривайте строки по порядку, слева направо, как при чтении. Отметку можно снять повторным нажатием.`, () => {
    const sel = new Set(), t0 = Date.now();
    stage(c, `<div class="sub" style="margin-top:.7rem">Ищем букву <b style="font-size:1.3rem;color:var(--acc)">${T}</b></div><div class="grid letters" style="grid-template-columns:repeat(${cols},1fr)">${cells.map((ch, i) => `<button data-i="${i}">${ch}</button>`).join('')}</div><div class="foot" id="act"><button class="btn pri" id="chk">Готово <kbd>Enter</kbd></button></div>`);
    $('.grid').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const i = +b.dataset.i; if (sel.has(i)) { sel.delete(i); b.classList.remove('lit'); } else { sel.add(i); b.classList.add('lit'); } };
    const check = () => {
      const sec = Math.round((Date.now() - t0) / 1000); let hit = 0, fa = 0;
      cells.forEach((ch, i) => { const b = $(`.grid [data-i="${i}"]`); b.disabled = true; b.classList.remove('lit'); if (ch === T && sel.has(i)) { hit++; b.classList.add('hit'); } else if (sel.has(i)) { fa++; b.classList.add('bad'); } else if (ch === T) b.classList.add('missed'); });
      $('#act').remove(); const tot = pos.length, clean = hit === tot && !fa; if (clean && (!BEST.proof || sec < BEST.proof)) { BEST.proof = sec; saveBest(); }
      finish(c, `Найдено ${hit} из ${tot}${fa ? `, ошибочно отмечено — ${fa}` : ''}. Время — ${sec} с.${hit < tot ? '<br><span class="hint">Пропущенные буквы обведены рамкой.</span>' : ''}`, { ok: Math.max(0, hit - fa), total: tot, value: `${hit} из ${tot}, ${sec} с` }, done, clean ? 'ok' : 'warm', 'Итог');
    };
    $('#chk').onclick = check; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
  });
};

/* ---------- 4. Внимание: тест Струпа ---------- */
const INK = [['КРАСНЫЙ', 'красный', '#c8372c'], ['СИНИЙ', 'синий', '#2a62c0'], ['ЗЕЛЁНЫЙ', 'зелёный', '#2e8b57'], ['ФИОЛЕТОВЫЙ', 'фиолетовый', '#8a45b8']];
U.stroop = (c, done) => {
  const N = 16;
  intro(c, 'Цвет, а не слово', 'На экране появится название цвета, напечатанное краской другого (или того же) цвета. Выберите <b>цвет краски</b>, не читая слово. Это трудно — и потому полезно.', () => {
    let i = 0, ok = 0, tsum = 0, t0 = 0, cur = null;
    const next = () => {
      if (i >= N) { KEY = null; const avg = Math.round(tsum / N / 100) / 10, rec = ok === N && (!BEST.stroop || avg < BEST.stroop); if (rec) { BEST.stroop = avg; saveBest(); } stage(c, ''); return finish(c, `Верно ${ok} из ${N}. В среднем ${String(avg).replace('.', ',')} с на ответ${rec ? ' — ваш лучший результат' : ''}.`, { ok, total: N, value: `${ok} из ${N}` }, done, ok >= N - 2 ? 'ok' : 'warm', 'Итог'); }
      const w = Math.floor(c.rng() * 4); let ink = w; if (c.rng() < .75) while (ink === w) ink = Math.floor(c.rng() * 4);
      cur = ink; i++;
      stage(c, `<div class="sub" style="margin-top:.7rem">${i} из ${N}</div><div class="stroop" style="color:${INK[ink][2]}">${INK[w][0]}</div><div class="opts" style="grid-template-columns:1fr 1fr">${INK.map((x, k) => `<button class="opt" data-o="${k}"><span class="sw" style="background:${x[2]}"></span><span>${x[1]}</span></button>`).join('')}</div>`);
      t0 = performance.now(); $('.opts').onclick = e => { const b = e.target.closest('.opt'); if (b) ans(+b.dataset.o); };
    };
    const ans = k => { if (cur == null) return; tsum += Math.min(performance.now() - t0, 10000); if (k === cur) ok++; cur = null; next(); };
    KEY = e => { if (/^[1-4]$/.test(e.key)) { e.preventDefault(); ans(+e.key - 1); } };
    next();
  });
};

/* ---------- 5. Память: ряд цифр ---------- */
U.span = (c, done) => {
  let L = clamp(BEST.span || 4, 3, 10), round = 0, top = 0; const R = 3;
  intro(c, 'Ряд цифр', `Цифры появятся по одной. Запомните их и наберите в том же порядке. Если получилось — ряд станет на одну цифру длиннее. Три попытки.`, () => {
    const go = () => {
      round++; const seq = Array.from({ length: L }, () => Math.floor(c.rng() * 10)); let k = 0;
      stage(c, `<div class="sub" style="margin-top:.7rem">Попытка ${round} из ${R} · ${L} ${plural(L, 'цифра', 'цифры', 'цифр')}</div><div class="big" id="d"></div>`);
      const showNext = () => { const d = $('#d'); if (!d) return; if (k < seq.length) { d.textContent = seq[k++]; later(900, () => { const x = $('#d'); if (x) x.textContent = ''; later(300, showNext); }); } else ask(); };
      const ask = () => {
        const kp = keypad(val => {
          const want = seq.join(''), ok = val === want;
          if (ok) { top = Math.max(top, L); L = Math.min(10, L + 1); } else L = Math.max(3, L - 1);
          $('.pad').remove();
          $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>Было: <b style="letter-spacing:.15em">${want}</b></div>`);
          if (round < R) later(1500, go); else { BEST.span = Math.max(4, L); if (top > (BEST.spanTop || 0)) BEST.spanTop = top; saveBest(); finish(c, top ? `Самый длинный ряд, повторённый без ошибки, — ${top} ${plural(top, 'цифра', 'цифры', 'цифр')}.` : 'В этот раз ряд не удалось повторить — в следующий раз он будет короче.', { value: top ? top + ' ' + plural(top, 'цифра', 'цифры', 'цифр') : '—', ok: top ? 1 : 0, total: 1 }, done, top ? 'ok' : 'warm', 'Итог'); }
        }, 12);
        stage(c, `<div class="sub" style="margin-top:.7rem">Попытка ${round} из ${R} · наберите цифры</div>${kp.html}`); kp.bind();
      };
      later(700, showNext);
    };
    go();
  });
};

/* ---------- 6. Память: что изменилось? ---------- */
const SHAPES = {
  circle: '<circle cx="50" cy="50" r="38"/>', square: '<rect x="14" y="14" width="72" height="72" rx="6"/>', tri: '<path d="M50 10 90 86H10z"/>',
  diamond: '<path d="M50 6 92 50 50 94 8 50z"/>', cross: '<path d="M38 10h24v28h28v24H62v28H38V62H10V38h28z"/>', ring: '<circle cx="50" cy="50" r="30" fill="none" stroke-width="16"/>'
};
const SCOL = ['#d0473a', '#2f6fc0', '#2f8f5b', '#e08a1e', '#7d4bb0'];
const shapeSvg = s => `<svg viewBox="0 0 100 100" fill="${s.c}" stroke="${s.c}">${SHAPES[s.f]}</svg>`;
U.change = (c, done) => {
  let K = clamp(BEST.change || 5, 4, 9), round = 0, okN = 0; const R = 3, F = Object.keys(SHAPES);
  intro(c, 'Что изменилось?', 'Вы увидите несколько фигур. Рассмотрите их и нажмите «Готово». Потом одна фигура изменится — форма или цвет. Найдите её.', () => {
    const go = () => {
      round++; const cellsN = K <= 6 ? 9 : 12, cols = 3, pos = shuffled(Array.from({ length: cellsN }, (_, i) => i), c.rng).slice(0, K);
      const items = {}; pos.forEach(p => items[p] = { f: pick(F, c.rng), c: pick(SCOL, c.rng) });
      const draw = (it, click) => `<div class="grid shapes" style="grid-template-columns:repeat(${cols},1fr);max-width:${cellsN === 9 ? 330 : 330}px">${Array.from({ length: cellsN }, (_, i) => `<button data-i="${i}" ${click ? '' : 'disabled'} style="${it[i] ? '' : 'background:transparent;border-style:dashed'}">${it[i] ? shapeSvg(it[i]) : ''}</button>`).join('')}</div>`;
      stage(c, `<div class="sub" style="margin-top:.7rem">Попытка ${round} из ${R} · ${K} ${plural(K, 'фигура', 'фигуры', 'фигур')}</div>${draw(items, false)}<div class="foot"><button class="btn pri" id="seen">Готово <kbd>Enter</kbd></button></div>`);
      const hide = () => {
        KEY = null; const ch = pick(pos, c.rng), it2 = JSON.parse(JSON.stringify(items));
        if (c.rng() < .5) { let f; do f = pick(F, c.rng); while (f === items[ch].f); it2[ch].f = f; } else { let col; do col = pick(SCOL, c.rng); while (col === items[ch].c); it2[ch].c = col; }
        stage(c, `<div class="sub" style="margin-top:.7rem">…</div><div style="height:330px"></div>`);
        later(1200, () => {
          stage(c, `<div class="sub" style="margin-top:.7rem">Попытка ${round} из ${R} · какая фигура изменилась?</div>${draw(it2, true)}`);
          $('.grid').onclick = e => {
            const b = e.target.closest('button'); if (!b || b.disabled) return; const i = +b.dataset.i, ok = i === ch;
            $$('.grid button').forEach(x => x.disabled = true); b.classList.add(ok ? 'hit' : 'bad'); if (!ok) $(`.grid [data-i="${ch}"]`).classList.add('missed');
            if (ok) { okN++; K = Math.min(9, K + 1); } else K = Math.max(4, K - 1);
            $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>${ok ? 'Именно эта фигура.' : 'Изменилась фигура в рамке.'}</div>`);
            if (round < R) later(1600, go); else { BEST.change = K; saveBest(); finish(c, `Найдено ${okN} из ${R}.`, { ok: okN, total: R, value: `${okN} из ${R}` }, done, okN >= 2 ? 'ok' : 'warm', 'Итог'); }
          };

      $('#seen').onclick = hide; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); hide(); } };

};

/* ---------- 7. Память: где загорались клетки (тест Корси) ---------- */
U.corsi = (c, done) => {
  let L = clamp(BEST.corsi || 3, 2, 9), round = 0, top = 0; const R = 3, n = 4;
  intro(c, 'Дорожка из клеток', 'Клетки будут загораться одна за другой. Затем нажмите их в том же порядке. Если получилось — дорожка станет длиннее.', () => {
    const go = () => {
      round++; const seq = []; while (seq.length < L) { const x = Math.floor(c.rng() * n * n); if (x !== seq[seq.length - 1]) seq.push(x); }
      stage(c, `<div class="sub" style="margin-top:.7rem">Попытка ${round} из ${R} · смотрите</div><div class="grid" style="grid-template-columns:repeat(${n},1fr);max-width:320px">${Array.from({ length: n * n }, (_, i) => `<button data-i="${i}" disabled></button>`).join('')}</div>`);
      let k = 0;
      const flash = () => { if (k >= seq.length) return later(400, ask); const b = $(`.grid [data-i="${seq[k]}"]`); if (!b) return; b.classList.add('lit'); later(700, () => { b.classList.remove('lit'); k++; later(300, flash); }); };
      const ask = () => {
        $('.sub').textContent = `Попытка ${round} из ${R} · нажмите клетки по порядку`; $$('.grid button').forEach(b => b.disabled = false); let j = 0;
        $('.grid').onclick = e => {
          const b = e.target.closest('button'); if (!b || b.disabled) return; const i = +b.dataset.i;
          const ok = i === seq[j]; b.classList.add(ok ? 'hit' : 'bad'); later(250, () => b.classList.remove('hit', 'bad'));
          if (!ok || ++j === seq.length) {
            $$('.grid button').forEach(x => x.disabled = true); $('.grid').onclick = null;
            if (ok) { top = Math.max(top, L); L = Math.min(9, L + 1); } else L = Math.max(2, L - 1);
            $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>${ok ? `Дорожка из ${seq.length} ${plural(seq.length, 'клетки', 'клеток', 'клеток')} повторена.` : 'Порядок сбился — ничего, попробуем ещё.'}</div>`);
            if (round < R) later(1500, go); else { BEST.corsi = Math.max(3, L); if (top > (BEST.corsiTop || 0)) BEST.corsiTop = top; saveBest(); finish(c, top ? `Самая длинная повторённая дорожка — ${top} ${plural(top, 'клетка', 'клетки', 'клеток')}.` : 'В этот раз не получилось — в следующий раз дорожка будет короче.', { ok: top ? 1 : 0, total: 1, value: top ? top + ' ' + plural(top, 'клетка', 'клетки', 'клеток') : '—' }, done, top ? 'ok' : 'warm', 'Итог'); }
          }
        };
      };
      later(700, flash);
    };
    go();
  });
};

/* ---------- 8. Воображение: поворот фигуры ---------- */
const pnorm = p => { const mx = Math.min(...p.map(q => q[0])), my = Math.min(...p.map(q => q[1])); return p.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]); };
const pkey = p => pnorm(p).map(q => q.join(',')).join(';');
const prot = p => pnorm(p.map(([x, y]) => [y, -x]));
const pmir = p => pnorm(p.map(([x, y]) => [-x, y]));
const prots = p => { const r = [pnorm(p)]; for (let i = 0; i < 3; i++) r.push(prot(r[r.length - 1])); return r; };
function polyGen(rng, n) { const s = [[0, 0]], has = (x, y) => s.some(q => q[0] === x && q[1] === y); while (s.length < n) { const [x, y] = pick(s, rng), [dx, dy] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]], rng); if (!has(x + dx, y + dy)) s.push([x + dx, y + dy]); } return pnorm(s); }
const polySvg = (p, col = 'var(--acc)') => { const w = Math.max(...p.map(q => q[0])) + 1, h = Math.max(...p.map(q => q[1])) + 1, S = 4, cs = 100 / S, ox = (100 - w * cs) / 2, oy = (100 - h * cs) / 2; return `<svg viewBox="-4 -4 108 108">${p.map(([x, y]) => `<rect x="${ox + x * cs}" y="${oy + y * cs}" width="${cs}" height="${cs}" fill="${col}" stroke="var(--panel)" stroke-width="2.5" rx="3"/>`).join('')}</svg>`; };
U.rotate = (c, done) => {
  const R = 4; let round = 0, okN = 0;
  intro(c, 'Поворот фигуры', 'Слева — фигура. Среди четырёх вариантов только один — <b>та же фигура, просто повёрнутая</b>. Остальные — её зеркальные отражения или другие фигуры. Поворачивайте фигуру в уме, не наклоняя голову.', () => {
    const go = () => {
      round++; let p, R0, M; do { p = polyGen(c.rng, 5 + (round > 2 ? 1 : 0)); R0 = new Set(prots(p).map(pkey)); M = prots(pmir(p)); } while (M.some(m => R0.has(pkey(m))) || Math.max(...p.map(q => q[0])) > 3 || Math.max(...p.map(q => q[1])) > 3);
      const rs = prots(p), right = rs.find((r, i) => i > 0 && pkey(r) !== pkey(p)) || rs[1];
      const wrong = [], keys = new Set([pkey(right)]);
      for (const m of shuffled(M, c.rng)) { if (wrong.length < 2 && !keys.has(pkey(m))) { wrong.push(m); keys.add(pkey(m)); } }
      for (let t = 0; wrong.length < 3 && t < 200; t++) { const q = polyGen(c.rng, p.length); const qk = prots(q).map(pkey), mk = prots(pmir(q)).map(pkey); if (qk.some(k => R0.has(k)) || mk.some(k => R0.has(k))) continue; const qq = pick(prots(q), c.rng); if (!keys.has(pkey(qq)) && Math.max(...qq.map(z => z[0])) < 4 && Math.max(...qq.map(z => z[1])) < 4) { wrong.push(qq); keys.add(pkey(qq)); } }
      const opts = shuffled([{ p: right, ok: true }, ...wrong.map(w => ({ p: w, ok: false }))], c.rng);
      stage(c, `<div class="sub" style="margin-top:.7rem">Задача ${round} из ${R} · какая фигура — эта же, только повёрнутая?</div><div class="target">${polySvg(p, 'var(--warm)')}</div><div class="figs">${opts.map((o, i) => `<button data-o="${i}"><span class="k">${i + 1}</span>${polySvg(o.p)}</button>`).join('')}</div>`);
      let over = false;
      const ans = i => { if (over || !opts[i]) return; over = true; const ok = opts[i].ok; if (ok) okN++; $$('.figs button').forEach((b, k) => { b.disabled = true; if (opts[k].ok) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
        KEY = null; $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>${ok ? 'Это та же фигура.' : 'Та же фигура отмечена зелёным. Остальные — её зеркальные отражения или другие фигуры.'}</div>`);
        if (round < R) { $('.stage').insertAdjacentHTML('beforeend', `<div class="foot"><button class="btn pri" id="more">Следующая <kbd>Enter</kbd></button></div>`); $('#more').onclick = go; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } }; }
        else finish(c, `Решено ${okN} из ${R}.`, { ok: okN, total: R, value: `${okN} из ${R}` }, done, okN >= 3 ? 'ok' : 'warm', 'Итог'); };
      $('.figs').onclick = e => { const b = e.target.closest('button'); if (b) ans(+b.dataset.o); };
      KEY = e => { if (/^[1-4]$/.test(e.key)) { e.preventDefault(); ans(+e.key - 1); } };
    };
    go();
  });
};

/* ---------- 9. Воображение: сложенный лист ---------- */
const foldSheet = (holes, fold) => { // лист 4×4 клетки: fold — какие части видны после сгиба
  let s = '<svg viewBox="-6 -6 112 112">';
  const vis = fold === 'V' ? [0, 0, 50, 100] : fold === 'VH' ? [0, 50, 50, 50] : fold === 'H' ? [0, 50, 100, 50] : [0, 0, 100, 100];
  if (fold) s += `<rect x="0" y="0" width="100" height="100" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>`;
  s += `<rect x="${vis[0]}" y="${vis[1]}" width="${vis[2]}" height="${vis[3]}" fill="${fold ? 'var(--warm-soft)' : 'var(--panel)'}" stroke="var(--mut)" stroke-width="1.5"/>`;
  for (const [x, y] of holes) s += `<circle cx="${x * 25 + 12.5}" cy="${y * 25 + 12.5}" r="7" fill="var(--fg)"/>`;
  return s + '</svg>';
};
const foldStep = (fold, line) => { // рисунок сгиба: пунктир и стрелка
  const base = foldSheet([], fold), arrow = line === 'V' ? '<path d="M85 50 Q50 20 18 50" fill="none" stroke="var(--warm)" stroke-width="3"/><path d="M18 50l9-3-3 9z" fill="var(--warm)"/><line x1="50" y1="0" x2="50" y2="100" stroke="var(--warm)" stroke-width="2" stroke-dasharray="5 4"/>'
    : '<path d="M25 15 Q8 50 25 85" fill="none" stroke="var(--warm)" stroke-width="3"/><path d="M25 85l-8-5 9-2z" fill="var(--warm)"/><line x1="0" y1="50" x2="' + (fold === 'V' ? 50 : 100) + '" y2="50" stroke="var(--warm)" stroke-width="2" stroke-dasharray="5 4"/>';
  return base.replace('</svg>', arrow + '</svg>');
};
const holeKey = h => h.map(q => q.join(',')).sort().join(';');
U.fold = (c, done) => {
  const R = 3; let round = 0, okN = 0;
  intro(c, 'Сложенный лист', 'Квадратный лист бумаги складывают пополам (иногда дважды) и прокалывают насквозь. Представьте, где окажутся дырки, когда лист развернут.', () => {
    const go = () => {
      round++; const two = round > 1 && c.rng() < .6, first = two ? 'V' : pick(['V', 'H'], c.rng), folds = two ? ['V', 'H'] : [first];
      const fx = folds.includes('V') ? Math.floor(c.rng() * 2) : Math.floor(c.rng() * 4), fy = folds.includes('H') ? 2 + Math.floor(c.rng() * 2) : Math.floor(c.rng() * 4), h = [fx, fy];
      const reflV = ([x, y]) => [3 - x, y], reflH = ([x, y]) => [x, 3 - y];
      let right = [h]; if (folds.includes('H')) right = [...right, ...right.map(reflH)]; if (folds.includes('V')) right = [...right, ...right.map(reflV)];
      const cands = [[h], [h, reflV(h)], [h, reflH(h)], [h, [3 - h[0], 3 - h[1]]], [h, [h[0], (h[1] + 2) % 4]], [h, [(h[0] + 2) % 4, h[1]]], [h, reflV(h), reflH(h)], [h, reflV(h), reflH(h), [3 - h[0], 3 - h[1]]], [h, [(h[0] + 2) % 4, h[1]], [h[0], (h[1] + 2) % 4], [(h[0] + 2) % 4, (h[1] + 2) % 4]]];
      const keys = new Set([holeKey(right)]), wrong = [];
      for (const w of shuffled(cands, c.rng)) { const k = holeKey(w); if (!keys.has(k) && wrong.length < 3) { keys.add(k); wrong.push(w); } }
      const opts = shuffled([{ h: right, ok: true }, ...wrong.map(w => ({ h: w, ok: false }))], c.rng);
      const st = folds.length === 1 ? (first === 'V' ? 'правую половину — на левую' : 'верхнюю половину — на нижнюю') : 'сначала правую половину — на левую, потом верхнюю — на нижнюю';
      const steps = folds.length === 1 ? `<figure>${foldStep('', first)}1. Сгибаем</figure><figure>${foldSheet([h], first)}2. Прокалываем</figure>` : `<figure>${foldStep('', 'V')}1. Сгиб</figure><figure>${foldStep('V', 'H')}2. Ещё сгиб</figure><figure>${foldSheet([h], 'VH')}3. Прокол</figure>`;
      stage(c, `<div class="sub" style="margin-top:.7rem">Задача ${round} из ${R} · лист сложили: ${st}.</div><div class="steps">${steps}</div><div class="sub">Как будет выглядеть развёрнутый лист?</div><div class="figs">${opts.map((o, i) => `<button data-o="${i}"><span class="k">${i + 1}</span>${foldSheet(o.h, '')}</button>`).join('')}</div>`);
      let over = false;
      const ans = i => { if (over || !opts[i]) return; over = true; const ok = opts[i].ok; if (ok) okN++; $$('.figs button').forEach((b, k) => { b.disabled = true; if (opts[k].ok) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
        KEY = null; $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>${folds.length === 1 ? 'Прокол проходит через два слоя, поэтому дырок две — они симметричны относительно линии сгиба.' : 'Лист сложен в четыре слоя, поэтому дырок четыре — по одной в каждой четверти, зеркально.'}</div>`);
        if (round < R) { $('.stage').insertAdjacentHTML('beforeend', `<div class="foot"><button class="btn pri" id="more">Следующая <kbd>Enter</kbd></button></div>`); $('#more').onclick = go; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } }; }
        else finish(c, `Решено ${okN} из ${R}.`, { ok: okN, total: R, value: `${okN} из ${R}` }, done, okN >= 2 ? 'ok' : 'warm', 'Итог'); };
      $('.figs').onclick = e => { const b = e.target.closest('button'); if (b) ans(+b.dataset.o); };
      KEY = e => { if (/^[1-4]$/.test(e.key)) { e.preventDefault(); ans(+e.key - 1); } };
    };
    go();
  });
};

/* ---------- 10. Воображение: общее слово (ассоциации) ---------- */
U.assoc = (c, done) => {

      $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>${a.w.map(w => esc(w) + ' ' + esc(a.o[0])).join(', ')}.</div>`);
      if (i < K) { $('.stage').insertAdjacentHTML('beforeend', `<div class="foot"><button class="btn pri" id="more">Следующее <kbd>Enter</kbd></button></div>`); $('#more').onclick = ask; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); ask(); } }; }
      else finish(c, `Верно ${okN} из ${K}.`, { ok: okN, total: K, value: `${okN} из ${K}` }, done, okN >= 3 ? 'ok' : 'warm', 'Итог');

};

/* ---------- 11. Воображение: открытое задание ---------- */
U.open = (c, done) => {

  const show = () => { $('#act').remove(); finish(c, `${t.e.map(esc).join('; ')}.`, { ok: 1, total: 1, value: '✓' }, done, 'warm', 'Можно было ответить, например, так'); };
  $('#ex').onclick = show; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); show(); } };

/* ---------- 12. Счёт в уме: цепочки ---------- */
U.maths = (c, done) => {
  let L = clamp(BEST.mathsLen || 3, 3, 6), round = 0, okN = 0; const R = 4;
  intro(c, 'Счёт в уме', 'Сначала появится число, потом действия — по одному. Выполняйте их в уме и в конце наберите результат. Записывать ничего не нужно.', () => {
    const go = () => {
      round++; let v = 2 + Math.floor(c.rng() * 8); const steps = [String(v)];
      for (let k = 0; k < L; k++) {
        const ops = ['+', '−', '×']; if (v % 2 === 0 && v > 2) ops.push('÷'); const op = pick(ops, c.rng);
        if (op === '+') { const a = 2 + Math.floor(c.rng() * 8); v += a; steps.push('+ ' + a); }
        else if (op === '−') { if (v < 3) { const a = 2 + Math.floor(c.rng() * 8); v += a; steps.push('+ ' + a); continue; } const a = 1 + Math.floor(c.rng() * Math.min(9, v - 1)); v -= a; steps.push('− ' + a); }
        else if (op === '×') { const a = v > 20 ? 2 : pick([2, 3], c.rng); v *= a; steps.push('× ' + a); }
        else { v /= 2; steps.push('÷ 2'); }
      }
      let k = 0;
      stage(c, `<div class="sub" style="margin-top:.7rem">Пример ${round} из ${R}</div><div class="big" id="d"></div>`);
      const showNext = () => { const d = $('#d'); if (!d) return; if (k < steps.length) { d.textContent = steps[k++]; later(1800, () => { const x = $('#d'); if (x) x.textContent = ''; later(350, showNext); }); } else ask(); };
      const ask = () => {
        const kp = keypad(val => {
          const ok = +val === v; if (ok) { okN++; L = Math.min(6, L + 1); } else L = Math.max(3, L - 1);
          $('.pad').remove(); $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${ok ? 'ok' : 'no'}"><span class="v">${ok ? 'Верно' : 'Не совсем'}</span>${esc(steps.join(' '))} = <b>${v}</b></div>`);
          if (round < R) later(1800, go); else { BEST.mathsLen = L; saveBest(); finish(c, `Верно ${okN} из ${R}.`, { ok: okN, total: R, value: `${okN} из ${R}` }, done, okN >= 3 ? 'ok' : 'warm', 'Итог'); }
        }, 5);
        stage(c, `<div class="sub" style="margin-top:.7rem">Пример ${round} из ${R} · сколько получилось?</div>${kp.html}`); kp.bind();
      };
      later(500, showNext);
    };
    go();
  });
};
/* =====================================================================
   blocks.js — «узнать новое»: ударения, фразеологизм, латынь, слово, стихи,
   повторение, загадка, улыбка.
   ===================================================================== */
// неверные варианты: элементы других групп близости
function others(list, it, field, rng, n = 3) {
  const out = [], seenG = new Set([it.g]), seenT = new Set([String(it[field]).toLowerCase()]);
  for (const x of shuffled(list, rng)) { if (out.length >= n) break; if (x === it || seenG.has(x.g) || seenT.has(String(x[field]).toLowerCase())) continue; out.push(x[field]); seenG.add(x.g); seenT.add(String(x[field]).toLowerCase()); }
  return out;
}
// несколько вопросов подряд внутри одного блока
function series(c, qs, done, summary) {
  let i = 0, ok = 0, total = 0;
  const ask = () => {
    const q = qs[i], cc = Object.assign({}, c, { n: qs.length, i });
    mcq(cc, { prompt: q.prompt, options: q.options, raw: q.raw, cls: q.cls, after: good => {
      total++; if (good) ok++; i++; KEY = null;
      $('.stage').insertAdjacentHTML('beforeend', `<div class="card ${good ? 'ok' : 'no'}"><span class="v">${good ? 'Верно' : 'Не совсем'}</span>${q.explain(good)}</div>`);
      if (i < qs.length) { $('.stage').insertAdjacentHTML('beforeend', `<div class="foot"><button class="btn pri" id="more">Дальше <kbd>Enter</kbd></button></div>`); $('#more').onclick = ask; $('#more').focus({ preventScroll: true }); KEY = e => { if (e.key === 'Enter') { e.preventDefault(); ask(); } }; later(30, () => { const m = $('#more'); if (m && m.getBoundingClientRect().bottom > innerHeight) m.scrollIntoView({ behavior: 'smooth', block: 'end' }); }); }
      else finish(c, null, Object.assign({ ok, total, value: `${ok} из ${total}` }, summary ? summary() : {}), done);
    } }, done);
  };
  ask();
}

/* ---------- ударения ---------- */

  series(c, ws.slice(0, n).map(w => ({
    prompt: `<div class="q" style="margin-top:.9rem">Как правильно?</div>`, cls: 'wordbtn', raw: true, options: [accentHtml(w.r), accentHtml(w.w)],
    explain: () => `<b class="serif" style="font-size:1.3rem">${accentHtml(w.r)}</b>${w.n ? `<p>${accentNote(w.n)}</p>` : ''}`
  })), done, () => ({ line: 'Ударения: ' + ws.slice(0, n).map(w => accented(w.r)).join(', ') }));
};

/* ---------- фразеологизм дня ---------- */
const phraseCard = (p, withQ) => `<h3>${esc(p.p)}${sayBtn(p.p + '. ' + p.m + '. ' + p.o)}</h3><p><b>Значение:</b> ${esc(p.m)}.</p>
  <p class="serif" style="font-size:1.05rem">${esc(p.o)}</p>${p.v ? `<p class="serif alt" style="font-size:1.02rem">${esc(p.v)}</p>` : ''}${p.s ? `<p class="src">Источник: ${esc(p.s)}</p>` : ''}${p.pic && ART[p.pic] ? `<div class="pic">${ART[p.pic]}</div>` : ''}`;

/* ---------- латынь дня ---------- */

/* ---------- стихи: три дня на одно стихотворение ---------- */
const poemHead = p => `<div class="sub" style="margin-top:.9rem">${esc(p.a)} · <i>${esc(p.t)}</i> · ${esc(p.y)}</div>`;
const isCut = p => /[,;:—-]$/.test(p.l[p.l.length - 1]);
U.poem = (c, done) => {
  const { p, phase } = poemOf(c.S);
  if (phase === 0) {
    stage(c, `${poemHead(p)}<div class="q">Новое стихотворение для заучивания</div><div class="poem">${p.l.map(l => `<span class="ln">${esc(l)}</span>`).join('')}${isCut(p) ? '<span class="ln hint">(начало стихотворения)</span>' : ''}</div>${sayBtn(p.l.join('\n'))}<div class="sub" style="font-size:1rem">Прочитайте его медленно два-три раза, лучше вслух. Представьте картину, о которой оно говорит. Завтра мы соберём его по строчкам, а послезавтра попробуем прочитать наизусть.</div>`);
    return finish(c, null, { ok: 1, total: 1, value: 'прочитано', line: `Стихи: ${p.a}, ${/^«/.test(p.t) ? p.t : '«' + p.t + '»'}` }, done);
  }
  if (phase === 1) {
    const order = shuffled(p.l.map((l, i) => i), c.rng); let next = 0, miss = 0;
    stage(c, `${poemHead(p)}<div class="q">Соберите стихотворение по строчкам</div><div class="sub">Нажимайте строчки по порядку — сначала первую, потом вторую…</div><div class="poem" id="built" style="min-height:2rem"></div><div class="lines">${order.map(i => `<button data-i="${i}">${esc(p.l[i])}</button>`).join('')}</div>`);
    $('.lines').onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i;
      if (i !== next) { miss++; b.classList.add('bad'); later(400, () => b.classList.remove('bad')); return; }
      b.remove(); $('#built').insertAdjacentHTML('beforeend', `<span class="ln">${esc(p.l[i])}</span>`); next++;
      if (next === p.l.length) { const sc = Math.max(0, p.l.length - miss); finish(c, miss ? `Собрано, ошибок: ${miss}. Завтра попробуем прочитать наизусть.` : 'Собрано без единой ошибки! Завтра попробуем прочитать наизусть.', { ok: sc, total: p.l.length, value: miss ? `ошибок: ${miss}` : 'без ошибок' }, done, miss <= 1 ? 'ok' : 'warm', 'Итог'); }
    };
    return;
  }
  stage(c, `${poemHead(p)}<div class="q">Прочитайте стихотворение наизусть</div><div class="sub" style="font-size:1rem">Подсказка — первые слова каждой строки. Прочитайте вслух, потом откройте текст и проверьте себя.</div><div class="poem">${p.l.map(l => { const w = l.split(' '); return `<span class="ln">${esc(w[0])}${w.length > 1 && w[0].length < 4 ? ' ' + esc(w[1]) : ''} <span class="cue">…</span></span>`; }).join('')}</div><div class="foot" id="act"><button class="btn pri" id="show">Открыть текст <kbd>Enter</kbd></button></div>`);
  const show = () => {
    $('#act').remove(); $('.poem').innerHTML = p.l.map(l => `<span class="ln">${esc(l)}</span>`).join('');
    $('.stage').insertAdjacentHTML('beforeend', `<div class="q" style="font-size:1.05rem">Как получилось?</div><div class="opts"><button class="opt" data-s="2"><span class="k">1</span>Почти всё вспомнилось</button><button class="opt" data-s="1"><span class="k">2</span>Вспомнилось частично</button><button class="opt" data-s="0"><span class="k">3</span>Пока не вспоминается</button></div>`);
    const rate = s => { $$('.opt').forEach(b => { b.disabled = true; if (+b.dataset.s === s) b.classList.add('right'); else b.classList.add('dim'); }); KEY = null; finish(c, s === 2 ? 'Прекрасно! Стихотворение можно считать выученным.' : s === 1 ? 'Хорошее начало. Перечитайте его сегодня ещё раз перед сном — так запоминается лучше.' : 'Ничего страшного: перечитайте его несколько раз в течение дня.', { ok: s, total: 2, value: ['не вспомнилось', 'частично', 'наизусть'][s] }, done, s ? 'ok' : 'warm', 'Итог'); if (s === 2) { const L = BEST.poems || []; if (!L.includes(p.t)) { L.push(p.t); BEST.poems = L; saveBest(); } } };
    $('.opts').onclick = e => { const b = e.target.closest('.opt'); if (b && !b.disabled) rate(+b.dataset.s); };

};

/* ---------- загадка ---------- */
U.puzzle = (c, done) => {

  $('#home').onclick = () => go('home');
}

/* ---------- запуск ---------- */
function boot() {
  applySettings(); initSpeech();
  $('#home-link').onclick = () => go('home'); $('#b-set').onclick = () => go('set');
  go('home');
}
boot();
</script>

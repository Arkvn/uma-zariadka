<title>Зарядка для ума</title>
<style>
:root{--fs:19px;--bg:#faf7f2;--panel:#fff;--soft:#f3eee6;--fg:#23211e;--mut:#6e6860;--line:#e3dbcf;--acc:#2f6b5b;--acc-fg:#fff;--acc-soft:#e3efe9;--warm:#b8692f;--warm-soft:#f8eadc;--ok:#2e7d4f;--ok-soft:#e1f1e6;--bad:#b8432f;--bad-soft:#f9e4df;--hl:#fff0c2;--shade:rgba(60,40,10,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181715;--panel:#22201d;--soft:#2b2824;--fg:#ece6dc;--mut:#a59e93;--line:#3b3731;--acc:#7cc4ad;--acc-fg:#10201b;--acc-soft:#1f3530;--warm:#e3a166;--warm-soft:#3a2a1c;--ok:#6cc893;--ok-soft:#1c3226;--bad:#f08c78;--bad-soft:#3d231e;--hl:#4b4122;--shade:rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#181715;--panel:#22201d;--soft:#2b2824;--fg:#ece6dc;--mut:#a59e93;--line:#3b3731;--acc:#7cc4ad;--acc-fg:#10201b;--acc-soft:#1f3530;--warm:#e3a166;--warm-soft:#3a2a1c;--ok:#6cc893;--ok-soft:#1c3226;--bad:#f08c78;--bad-soft:#3d231e;--hl:#4b4122;--shade:rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{color:var(--acc)}
h1,h2,h3,p{margin:0}
.serif{font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:720px;margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem}
.brand{background:none;border:0;padding:0;font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:.45rem;color:var(--fg);white-space:nowrap}
.brand svg{width:1.5rem;height:1.5rem;color:var(--acc)}
.brand small{font-weight:400;color:var(--mut);font-size:.84rem}
.sp{flex:1}
.ib{background:none;border:1px solid var(--line);border-radius:.6rem;min-width:2.4rem;height:2.4rem;padding:0 .55rem;color:var(--mut);display:inline-grid;place-items:center;font-size:.86rem}
.ib:hover{color:var(--fg);border-color:var(--mut)}
.ib svg{width:1.15rem;height:1.15rem}
.bar{max-width:720px;margin:0 auto;padding:0 1rem .5rem;display:flex;gap:3px}
.bar i{flex:1;height:5px;background:var(--line);border-radius:3px}
.bar i.d{background:var(--acc)}
.bar i.c{background:var(--warm)}
main{max-width:720px;margin:0 auto;padding:0 1rem 3rem}
.stage{padding-top:1.1rem}
.tag{display:flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tag .ic{width:2rem;height:2rem;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.tag .ic svg{width:1.15rem;height:1.15rem}
.tag b{color:var(--acc);font-weight:700}
.tag .skip{margin-left:auto;background:none;border:0;color:var(--mut);font-size:.8rem;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:3px;padding:.3rem}
.q{font-size:1.28rem;line-height:1.45;margin:.8rem 0 .7rem}
.q.big{font-size:1.6rem;font-weight:600}
.sub{color:var(--mut);font-size:.92rem;margin:.2rem 0 .7rem}
.opts{display:grid;gap:.5rem;margin:.8rem 0}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:.8rem;padding:.75rem .9rem;min-height:3.2rem;box-shadow:0 1px 2px var(--shade)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{flex:none;width:1.5rem;height:1.5rem;border-radius:.4rem;background:var(--soft);color:var(--mut);font-size:.75rem;display:grid;place-items:center}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.btn{background:var(--panel);border:1.5px solid var(--line);border-radius:.8rem;padding:.7rem 1.15rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;color:var(--fg);min-height:3rem}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.wide{width:100%}
.btn.sm{min-height:2.4rem;padding:.4rem .8rem;font-size:.88rem;font-weight:500}
.btn:disabled{opacity:.45}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.foot{margin-top:1.2rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.hint{color:var(--mut);font-size:.86rem}
kbd{font:.7rem ui-monospace,Consolas,monospace;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin-top:1rem;box-shadow:0 1px 3px var(--shade)}
.card.ok{border-left:4px solid var(--ok)}
.card.no{border-left:4px solid var(--bad)}
.card.warm{border-left:4px solid var(--warm)}
.card .v{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem;color:var(--mut);font-weight:700}
.card.ok .v{color:var(--ok)}
.card.no .v{color:var(--bad)}
.card h3{font:600 1.25rem/1.3 Georgia,"Times New Roman",serif;margin-bottom:.35rem}
.card p{margin:.45rem 0 0}
.card .src{color:var(--mut);font-size:.84rem;margin-top:.55rem}
.card .alt{color:var(--mut);font-style:italic}
.say{background:none;border:1px solid var(--line);border-radius:50%;width:2.3rem;height:2.3rem;display:inline-grid;place-items:center;color:var(--acc);vertical-align:middle;margin-left:.3rem}
.say svg{width:1.1rem;height:1.1rem}
.pic{max-width:320px;margin:.7rem auto 0}
.pic svg{width:100%;height:auto;display:block}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.9rem 0}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chips button,.chips span{background:var(--panel);border:1.5px solid var(--line);border-radius:.7rem;padding:.65rem .5rem;text-align:center;min-height:3rem;display:grid;place-items:center;font-size:1.02rem}
.chips span{font-weight:600;font-size:1.12rem}
.chips button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.chips .ok{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.chips .no{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.chips .miss{border-color:var(--warm)!important;border-style:dashed!important}
.grid{display:grid;gap:.4rem;margin:.9rem auto;max-width:430px}
.grid button{aspect-ratio:1;background:var(--panel);border:1.5px solid var(--line);border-radius:.6rem;font-size:1.25rem;font-weight:600;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--acc-soft);color:var(--mut);border-color:transparent}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad)}
.grid button.lit{background:var(--warm);border-color:var(--warm)}
.grid button.hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.missed{border-color:var(--warm);border-width:2.5px}
.grid.letters button{font-size:1.15rem;font-family:Georgia,"Times New Roman",serif;font-weight:500;aspect-ratio:auto;min-height:2.6rem}
.grid.shapes button svg{width:72%;height:72%}
.big{font-size:3.2rem;font-weight:700;text-align:center;min-height:4.6rem;margin:1.2rem 0;font-variant-numeric:tabular-nums}
.stroop{font-size:2.6rem;font-weight:800;text-align:center;margin:1.4rem 0 .6rem;letter-spacing:.04em}
.sw{width:1.3rem;height:1.3rem;border-radius:50%;flex:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;max-width:340px;margin:.6rem auto}
.pad button{min-height:3.3rem;font-size:1.35rem;font-weight:600;background:var(--panel);border:1.5px solid var(--line);border-radius:.7rem}
.pad button.ok{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-size:1.05rem}
.entry{font-size:2rem;text-align:center;letter-spacing:.25em;min-height:3.2rem;border-bottom:2px solid var(--acc);max-width:340px;margin:.6rem auto;font-variant-numeric:tabular-nums;font-weight:600}
.poem{font:1.18rem/1.7 Georgia,"Times New Roman",serif;margin:.8rem 0;padding:.6rem 0 .6rem 1rem;border-left:3px solid var(--warm)}
.poem .ln{display:block}
.poem .cue{color:var(--mut)}
.lines{display:grid;gap:.45rem;margin:.8rem 0}
.lines button{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:.7rem;padding:.6rem .85rem;font:1.05rem/1.45 Georgia,"Times New Roman",serif}
.lines button.bad{border-color:var(--bad);background:var(--bad-soft)}
.wordbtn{font:1.7rem/1.2 Georgia,"Times New Roman",serif!important;justify-content:center!important;letter-spacing:.02em}
.joke{font:1.12rem/1.65 Georgia,"Times New Roman",serif;white-space:pre-line}
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.8rem 0}
.figs button{background:var(--panel);border:1.5px solid var(--line);border-radius:.8rem;padding:.6rem;display:grid;place-items:center;position:relative}
.figs button svg{width:100%;max-width:130px;height:auto}
.figs button .k{position:absolute;top:.4rem;left:.5rem;font-size:.75rem;color:var(--mut)}
.figs button.right{border-color:var(--ok);background:var(--ok-soft)}
.figs button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.target{display:flex;justify-content:center;margin:.4rem 0}
.target svg{width:150px;height:auto}
.steps{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.steps figure{margin:0;text-align:center;font-size:.78rem;color:var(--mut)}
.steps svg{width:110px;height:110px;display:block}
.home h1{font:600 2.1rem/1.15 Georgia,"Times New Roman",serif;margin:1.4rem 0 .2rem}
.lead{color:var(--mut)}
.plan{margin:1.2rem 0 0;border-top:1px solid var(--line)}
.plan div{display:flex;gap:.7rem;align-items:center;border-bottom:1px solid var(--line);padding:.55rem 0;font-size:.95rem}
.plan .ic{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.plan .ic svg{width:1.05rem;height:1.05rem}
.plan b{font-weight:600;min-width:9.5rem}
.plan span{color:var(--mut)}
.stats{display:flex;gap:1.4rem;flex-wrap:wrap;margin:1.3rem 0 .4rem}
.stats div b{display:block;font-size:1.55rem;font-weight:700}
.stats div span{color:var(--mut);font-size:.84rem}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:.6rem 0 0}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.dots i.d{background:var(--acc)}
.res{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.95rem}
.res td{padding:.5rem .2rem;border-bottom:1px solid var(--line);vertical-align:top}
.res td:last-child{text-align:right;white-space:nowrap;color:var(--mut)}
hr{border:0;border-top:1px solid var(--line);margin:1.4rem 0}
.warn{background:var(--warm-soft);border-radius:.8rem;padding:.7rem .9rem;font-size:.9rem;margin-top:1rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(1rem);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:.7rem;font-size:.92rem;transition:transform .25s,opacity .25s;max-width:92vw;z-index:9;text-align:center;opacity:0;visibility:hidden}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.fsrow{display:flex;align-items:center;gap:.6rem}
.fsrow b{min-width:3rem;text-align:center}
.center{text-align:center}
.mark{background:var(--hl);border-radius:.25rem;padding:0 .15rem}
.sv{color:var(--warm);font-weight:700}
@media (max-width:520px){.q{font-size:1.18rem}.q.big{font-size:1.4rem}.home h1{font-size:1.75rem}.plan b{min-width:7.6rem}.stroop{font-size:2.1rem}.big{font-size:2.7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

const D={"phrases":[{"p":"Конь не валялся","g":"delay","m":"дело ещё даже не начато","o":"Лошадь, которую выводят из конюшни, любит поваляться на траве — так она чистит шкуру. По распространённому объяснению, перед запряжкой ей давали это сделать. Если «конь не валялся», значит, к поездке ещё и не начинали готовиться.","v":"","s":"","q":["Как обычно объясняют это выражение?","Перед запряжкой лошади давали поваляться на траве","Валяющийся на дороге конь считался дурной приметой","Так называли детскую игру в лошадки"],"pic":"horse"},{"p":"Бить баклуши","g":"idle","m":"бездельничать","o":"Баклуша — чурка, заготовка из осины или липы, из которой потом вырезали ложки и чашки. Расколоть чурбан на баклуши было делом самым простым: его поручали подросткам и подмастерьям. Отсюда «бить баклуши» — заниматься пустяком, а потом и вовсе бездельничать.","v":"","s":"","q":["Что такое баклуши?","Деревянные чурки — заготовки для ложек","Маленькие колокольчики на дуге","Пустые бочки, по которым стучали ради забавы"],"pic":"baklushi"},{"p":"Точить лясы","g":"talk","m":"болтать, пустословить","o":"Лясы (балясы) — фигурные точёные столбики перил на крыльце. Точить их было тонкой, затейливой работой. Со временем «балясами» стали называть затейливую речь и шутки, а «точить лясы» — вести пустые разговоры.","v":"","s":"","q":["Что такое лясы?","Точёные столбики перил","Деревянные ложки","Ножи для резьбы по дереву"],"pic":"lyasy"},{"p":"Попасть впросак","g":"trouble","m":"оказаться в неловком, глупом положении","o":"Просак — станок для витья верёвок и канатов: длинная решётка с крючками и вращающимися колёсами. Попасть в просак краем одежды, волосами или бородой было очень опасно — человека затягивало в механизм.","v":"","s":"","q":["Что такое просак?","Станок для витья верёвок","Болотистая яма у дороги","Мешок для зерна"],"pic":"prosak"},{"p":"Работать спустя рукава","g":"careless","m":"небрежно, кое-как","o":"Старинная русская одежда — рубахи, кафтаны, шубы — шилась с очень длинными рукавами, иногда до колен. Работать, не засучив, а спустив рукава, было невозможно: дело выходило плохим и медленным.","v":"","s":"","q":["Почему «спустя рукава» — это плохо?","Длинные рукава старинной одежды мешали работать","Спущенные рукава были знаком траура","Так одевались только лентяи-бояре"],"pic":"sleeves"},{"p":"Зарубить на носу","g":"remember","m":"крепко запомнить","o":"По самой распространённой версии, «нос» здесь — не часть лица, а памятная дощечка (бирка), которую носили с собой: слово связывают с глаголом «носить». На ней делали зарубки, отмечая долг или сделанную работу: неграмотному человеку бирка заменяла записи.","v":"По другой версии, нос здесь самый настоящий: выражение возникло как шутливая угроза — сделать зарубку прямо на носу, чтобы человек запомнил накрепко.","s":"","q":["Что такое «нос» по самой распространённой версии?","Дощечка-бирка для зарубок","Нос корабля","Нос сапога"],"pic":"tally"},{"p":"Водить за нос","g":"deceive","m":"обманывать, обнадёживать и не выполнять обещанного","o":"Скоморохи и поводыри водили по ярмаркам учёных медведей за кольцо, продетое в нос, и заставляли их показывать «номера». Медведь шёл туда, куда его тянули, — отсюда значение «обманывать, распоряжаться кем-то как угодно».","v":"","s":"","q":["Кого в старину водили за нос?","Учёных медведей на ярмарке","Провинившихся слуг","Лошадей на водопой"],"pic":""},{"p":"Вся подноготная","g":"secret","m":"самые сокровенные подробности, вся правда о ком-либо","o":"Выражение связано с жестоким допросом в старину: подозреваемому загоняли иглы под ногти, чтобы выведать правду. «Подноготная правда» — правда, добытая такой пыткой.","v":"","s":"","q":[],"pic":""},{"p":"Шиворот-навыворот","g":"wrong","m":"наоборот, совсем не так, как нужно","o":"«Шиворотом» в старину называли ворот одежды. По преданию, при Иване Грозном провинившегося боярина сажали на коня задом наперёд, в одежде, вывернутой наизнанку, и возили по городу на посмешище.","v":"Многие словари объясняют выражение проще: одежду надели воротом вниз, наизнанку — то есть совсем неправильно.","s":"","q":[],"pic":""},{"p":"Через пень-колоду","g":"careless","m":"кое-как, с перерывами, плохо","o":"Колода — лежащий в лесу толстый ствол. Пробираться по лесу «через пень и колоду» приходится медленно, спотыкаясь, с остановками. Так стали говорить о любом деле, которое идёт плохо и неровно.","v":"","s":"","q":[],"pic":""},{"p":"Тянуть канитель","g":"delay","m":"медлить, затягивать нудное дело","o":"Канитель — тончайшая золотая или серебряная нить для вышивки. Её вытягивали из нагретого металла вручную, долго и кропотливо. Отсюда и «канитель» в значении «волокита, долгое скучное дело».","v":"","s":"","q":["Что такое канитель?","Тонкая металлическая нить для вышивки","Верёвка для бурлаков","Старинная мера длины"],"pic":"kanitel"},{"p":"Разделать под орех","g":"threat","m":"сурово отругать, раскритиковать","o":"Столяры отделывали мебель из простого дерева «под орех» — так, чтобы она выглядела как дорогая ореховая. Это была тщательная работа. В шутку «разделать под орех» стали говорить о тщательном, основательном разносе.","v":"","s":"","q":[],"pic":""},{"p":"Отложить в долгий ящик","g":"delay","m":"надолго отложить решение дела","o":"По преданию, царь Алексей Михайлович велел поставить у дворца в Коломенском ящик для челобитных — прошений. Читали их неспешно, ответ ждали годами, и ящик прозвали «долгим».","v":"По другой версии, «долгий» значит просто «длинный»: в приказах были длинные ящики, куда складывали дела, до которых не доходили руки.","s":"","q":[],"pic":""},{"p":"Филькина грамота","g":"fake","m":"никчёмный, ничего не значащий документ","o":"По самой известной версии, митрополит Московский Филипп писал Ивану Грозному послания, обличая опричнину, а царь пренебрежительно называл их «филькиными грамотами» (Филька — уничижительное от Филиппа). Однако это лишь предание. Позже выражение стало означать бумагу, не имеющую силы.","v":"По другой версии, выражение сложилось по образцу «жалованная грамота», «духовная грамота», а Филька — просто пренебрежительное имя простака, невежды: «филькина грамота» — бумага, неграмотно составленная невеждой.","s":"","q":["Кто такой Филька по самой известной версии?","Митрополит Филипп, обличавший Ивана Грозного","Купец, торговавший фальшивыми векселями","Шут Петра I, писавший указы за царя"],"pic":""},{"p":"Показать, где раки зимуют","g":"threat","m":"строго наказать, проучить (угроза)","o":"Раки зимуют в норах под корягами у берега. Ловить их зимой в ледяной воде — тяжёлое и мучительное занятие; по распространённому объяснению, помещик мог послать на такую ловлю провинившегося крестьянина.","v":"","s":"","q":[],"pic":""},{"p":"Куда Макар телят не гонял","g":"far","m":"очень далеко, в глухое место (обычно об угрозе, ссылке)","o":"Макар — обычное в старину крестьянское имя. Телят пасут поблизости от деревни, и «куда Макар телят не гонял» — значит в самую глушь, куда никто не ходит. Выражение часто звучало как угроза отправить в ссылку.","v":"","s":"","q":[],"pic":""},{"p":"Как с гуся вода","g":"indifferent","m":"всё нипочём, ничего не действует","o":"Перья гуся смазаны жиром, и вода с них скатывается. Выражение известно и из старинного заговора: обливая ребёнка водой, приговаривали «С гуся вода, с лебедя вода, а с тебя худоба» — чтобы болезни скатились, как вода с гуся.","v":"","s":"","q":[],"pic":""},{"p":"На воре и шапка горит","g":"guilty","m":"виноватый сам себя выдаёт","o":"Есть старая притча: на базаре долго не могли найти вора, и тогда кто-то крикнул: «Смотрите, на воре шапка горит!» Один из толпы схватился за голову — так и выдал себя.","v":"","s":"","q":[],"pic":""},{"p":"Показать кузькину мать","g":"threat","m":"сурово проучить (угроза)","o":"Происхождение выражения не выяснено: кто такой Кузька, не установлено, есть только догадки (домовой, жук-вредитель, просто простонародное имя). Зато известна его громкая судьба: в 1959 году Н. С. Хрущёв пообещал «показать кузькину мать» вице-президенту США Р. Никсону, и переводчикам пришлось изрядно поломать голову.","v":"","s":"","q":[],"pic":""},{"p":"Дело в шляпе","g":"success","m":"всё удалось, всё решено","o":"Происхождение толкуют по-разному. По одной версии, в шляпу бросали жребий: что вынули из шляпы, то и решено. По другой — так подьячие брали взятки, подставляя шляпу: если подношение принято, дело решится в пользу просителя.","v":"","s":"","q":[],"pic":""},{"p":"Бабушка надвое сказала","g":"unknown","m":"неизвестно, сбудется ли","o":"Полностью поговорка звучит так: «Бабушка надвое сказала: либо дождик, либо снег, либо будет, либо нет». «Бабушка» здесь — гадалка, знахарка, которая предсказывала двусмысленно, чтобы не ошибиться.","v":"","s":"","q":[],"pic":""},{"p":"Собаку съел","g":"expert","m":"очень опытен в каком-либо деле","o":"По распространённому объяснению, это первая половина насмешливой поговорки «Собаку съел, да хвостом подавился» — о человеке, который почти справился с трудным делом, а на мелочи сорвался. Насмешка забылась, а похвала осталась.","v":"","s":"","q":[],"pic":""},{"p":"Тёртый калач","g":"expert","m":"бывалый, опытный человек, которого трудно провести","o":"Калач из тёртого, долго мятого теста выходил пышным и крепким. Есть пословица «Не тёрт, не мят — не будет калач». Так стали говорить и о человеке, которого жизнь «потёрла» и закалила.","v":"","s":"","q":[],"pic":""},{"p":"Семь пятниц на неделе","g":"fickle","m":"о том, кто постоянно меняет свои решения и намерения","o":"В старину пятница была базарным днём: в этот день заключали сделки и обещали вернуть долг или привезти товар «в следующую пятницу». Тот, у кого таких «пятниц» было много, слова не держал.","v":"","s":"","q":[],"pic":""},{"p":"Ни зги не видно","g":"dark","m":"совсем темно, ничего не видно","o":"Что такое «зга», спорят давно. Большинство этимологов связывают это слово с древним «стьга» — дорожка, тропинка (ср. «стезя»): ни тропинки не видно. По другой версии, зга — кольцо на дуге упряжи, к которому привязывали колокольчик: в темноте ямщик не видел даже его.","v":"","s":"","q":[],"pic":""},{"p":"Ни бельмеса не понимать","g":"ignorant","m":"совершенно ничего не понимать","o":"Слово пришло из тюркских языков: «билмес» значит «не знает». Русское ухо восприняло его как непонятное «бельмес».","v":"","s":"","q":[],"pic":""},{"p":"От аза до ижицы","g":"whole","m":"от начала до конца, полностью","o":"Аз — название первой буквы старой русской азбуки, ижица — последней. «Ни аза не знать» — не знать даже первой буквы, а «от аза до ижицы» — весь алфавит, всё целиком.","v":"","s":"","q":[],"pic":""},{"p":"Ставить точки над i","g":"clarity","m":"доводить дело до конца, вносить полную ясность","o":"В латинском письме буква i долго писалась без точки, и в рукописях её легко было спутать с соседними штрихами — например, ii и u. Точку над i стали ставить для ясности. Поставить её — значит устранить последнюю неясность. В русский язык выражение пришло из французского: mettre les points sur les i.","v":"","s":"","q":[],"pic":""},{"p":"Шито белыми нитками","g":"obvious","m":"неумело скрыто, обман легко заметен","o":"Портной сначала смётывает изделие на живую нитку — белыми стежками, — а потом их выдёргивает. Если белые нитки остались видны, сразу заметно, что работа не закончена и сделана грубо. В русский язык выражение пришло из французского (cousu de fil blanc). Так говорят о хитрости, которую легко разгадать.","v":"","s":"","q":[],"pic":""},{"p":"Выносить сор из избы","g":"private","m":"разглашать то, что касается только своих","o":"По старинному поверью, сор из избы не выносили, а сжигали в печи: недобрый человек мог навести порчу на хозяев с помощью их мусора. Ссоры и семейные дела тоже было принято держать в своём доме.","v":"","s":"","q":[],"pic":""},{"p":"Не лыком шит","g":"expert","m":"не так прост, знает толк","o":"Лыко — внутренняя часть коры липы, из которой плели лапти, самую простую обувь. Сказать «не лыком шит» — значит: не простак в лаптях, а человек умелый и знающий.","v":"","s":"","q":[],"pic":""},{"p":"Лезть на рожон","g":"risk","m":"действовать напролом, идти на явную опасность","o":"Рожон — заострённый кол. На медвежьей охоте охотник выставлял перед собой рожон (или рогатину), и разъярённый зверь сам на него напарывался. «Лезть на рожон» — бросаться навстречу верной беде.","v":"","s":"","q":[],"pic":""},{"p":"Пройти огонь, воду и медные трубы","g":"expert","m":"многое испытать в жизни, иметь большой опыт","o":"Огонь и вода — древние испытания («божий суд»), а медные трубы, по распространённому толкованию, — слава и почести, звук труб в честь героя. Выдержать и беды, и славу — значит пройти всё.","v":"","s":"","q":[],"pic":""},{"p":"Гол как сокол","g":"poor","m":"очень беден, ничего нет","o":"Словари объясняют выражение по-разному. По одной версии, «сокол» — гладкое бревно-таран, которым разбивали ворота крепостей: оно было совершенно «голое». По другой — речь о птенце сокола, который рождается почти без перьев.","v":"","s":"","q":[],"pic":""},{"p":"Втирать очки","g":"deceive","m":"обманывать, представлять дело в лучшем виде","o":"«Очки» — знаки на игральных картах. Шулеры незаметно «втирали» на карту лишнее очко (мелом или особым порошком) и превращали, например, двойку в тройку. Так обман за карточным столом дал имя любому очковтирательству.","v":"","s":"","q":["Какие очки «втирали»?","Знаки на игральных картах","Стёкла для чтения","Баллы на школьном экзамене"],"pic":""},{"p":"Перемывать косточки","g":"talk","m":"сплетничать, обсуждать кого-то за глаза","o":"По одной из версий, выражение восходит к старинному обряду повторного захоронения: кости умершего выкапывали, омывали и вновь хоронили, вспоминая при этом его дела — и добрые, и худые.","v":"","s":"","q":[],"pic":""},{"p":"У чёрта на куличках","g":"far","m":"очень далеко, в глухом месте","o":"Кулички (кулижки) — лесные поляны, болотистые места на окраинах, где, по поверьям, водилась нечистая сила. В Москве была местность Кулишки — когда-то глухая окраина у Солянки.","v":"","s":"","q":[],"pic":""},{"p":"Тянуть лямку","g":"futile","m":"выполнять тяжёлую, однообразную работу","o":"Лямка — широкий ремень, которым бурлаки тянули против течения тяжёлые суда. Это была одна из самых изнурительных работ на Волге.","v":"","s":"","q":[],"pic":"lyamka"},{"p":"Отставной козы барабанщик","g":"useless","m":"человек, который никому не нужен, ничего не значит","o":"Когда скоморохи водили по ярмаркам учёного медведя, с ними был мальчик, наряженный козой, и барабанщик, созывавший публику. «Отставной козы барабанщик» — даже не барабанщик, а барабанщик при козе, да ещё и отставной: никчёмнее не придумаешь.","v":"","s":"","q":[],"pic":""},{"p":"Ни пуха ни пера","g":"wish","m":"пожелание удачи перед трудным делом","o":"Так желали удачи охотнику — нарочно наоборот, чтобы не «сглазить» добычу: ни пуха (зверя), ни пера (птицы). Отвечали так же суеверно: «К чёрту!»","v":"","s":"","q":[],"pic":""},{"p":"Крокодиловы слёзы","g":"false","m":"притворное сочувствие","o":"В старину верили, что крокодил плачет, пожирая жертву. Слёзы у крокодила действительно бывают, особенно во время еды, но это работа желёз, а не жалость.","v":"","s":"","q":[],"pic":""},{"p":"Львиная доля","g":"most","m":"большая, лучшая часть","o":"В басне Эзопа лев охотится вместе с другими зверями, а добычу делит так, что все доли забирает себе. Сначала «львиная доля» означала «всё»; теперь — «большая часть».","v":"","s":"Эзоп, басня о льве и его товарищах по охоте","q":[],"pic":""},{"p":"Вернёмся к нашим баранам","g":"topic","m":"вернёмся к главному, к предмету разговора","o":"Из французского фарса XV века «Адвокат Пьер Патлен». Суконщик судится с пастухом, укравшим у него баранов, но то и дело сбивается на своё сукно. Судья возвращает его: «Вернёмся к нашим баранам!»","v":"","s":"","q":[],"pic":""},{"p":"Всыпать по первое число","g":"threat","m":"сурово наказать","o":"По распространённому объяснению, выражение пришло из старой школы: учеников наказывали розгами, и провинившегося, бывало, секли «с запасом» — так, чтобы хватило до первого числа следующего месяца.","v":"","s":"","q":[],"pic":""},{"p":"Без сучка, без задоринки","g":"success","m":"гладко, без помех и затруднений","o":"Плотницкое выражение: хорошая доска — без сучков и без задоринок, то есть без зазубрин и шероховатостей. Обработать её легко, и работа идёт гладко.","v":"","s":"","q":[],"pic":""},{"p":"Первый блин комом","g":"start","m":"первая попытка часто неудачна","o":"Первый блин действительно часто прилипает и сворачивается в ком: сковорода ещё не прогрелась как следует. Популярная история о том, что первый блин отдавали медведям — «комам», — словарями не подтверждается: это поздняя выдумка, «народная этимология».","v":"","s":"","q":["Что говорят словари о версии про медведей-«комов»?","Это поздняя выдумка: «ком» здесь — просто ком","Это точно доказано летописями","Так медведей называли во всех славянских языках"],"pic":""},{"p":"Белая ворона","g":"unusual","m":"человек, резко непохожий на окружающих","o":"Вороны-альбиносы встречаются очень редко. Сравнение известно с античности: римский поэт Ювенал писал о том, что встречается «реже белой вороны».","v":"","s":"Ювенал, Сатира VII","q":[],"pic":"crow"},{"p":"Остаться с носом","g":"nothing","m":"остаться ни с чем, обманутым","o":"По одной из версий, «нос» здесь — подношение (от «носить»): жених приносил родителям невесты выкуп-подарок. Если ему отказывали, он уходил со своим «носом», то есть ни с чем.","v":"","s":"","q":[],"pic":""},{"p":"Купить кота в мешке","g":"risk","m":"приобрести что-то не глядя, не зная, каково оно","o":"Ярмарочная проделка, известная во многих странах: покупателю продавали поросёнка в мешке, а дома вместо поросёнка оказывался кот. Англичане говорят наоборот: «купить свинью в мешке» (buy a pig in a poke).","v":"","s":"","q":[],"pic":"cat"},{"p":"Будто аршин проглотил","g":"stiff","m":"стоит или держится неестественно прямо","o":"Аршин — старинная мера длины (около 71 см) и деревянная мерная линейка такой длины. Кто «проглотил аршин», не может согнуться.","v":"","s":"","q":[],"pic":"arshin"},{"p":"Пуд соли съесть","g":"know","m":"хорошо узнать человека, прожив с ним долго","o":"Пуд — старинная мера веса, около 16 кг. Чтобы вдвоём съесть пуд соли, нужно прожить вместе немало времени. Отсюда пословица «Чтобы узнать человека, надо с ним пуд соли съесть».","v":"","s":"","q":[],"pic":""},{"p":"Пристал как банный лист","g":"annoy","m":"назойливо пристал, не отвяжешься","o":"В бане листья берёзового веника прилипают к распаренному телу так, что их трудно отлепить.","v":"","s":"","q":[],"pic":""},{"p":"Сбоку припёка","g":"useless","m":"лишний, посторонний, ни при чём","o":"Припёк — кусок теста, который случайно прилип к караваю сбоку и запёкся. Он не нужен и никому не интересен.","v":"","s":"","q":[],"pic":""},{"p":"Тьма-тьмущая","g":"plenty","m":"очень много","o":"В древнерусском счёте «тьма» означала десять тысяч. Отсюда и «темник» — военачальник над десятью тысячами воинов. «Тьма-тьмущая» — несметное множество.","v":"","s":"","q":[],"pic":""},{"p":"Узнать, почём фунт лиха","g":"expert","m":"испытать много горя и трудностей","o":"Фунт — старинная мера веса, около 400 граммов, а лихо — беда, горе. Узнать цену фунту лиха — значит на себе узнать, что такое настоящая беда.","v":"","s":"","q":[],"pic":""},{"p":"Ходить гоголем","g":"proud","m":"держаться важно, самодовольно","o":"Гоголь здесь — не писатель, а птица, утка-гоголь. На суше она ходит важно, выпятив грудь и откинув голову.","v":"","s":"","q":["Какой гоголь имеется в виду?","Утка-гоголь","Писатель Н. В. Гоголь","Сладкий напиток гоголь-моголь"],"pic":""},{"p":"Ехать в Тулу со своим самоваром","g":"useless","m":"брать с собой то, чего на месте и так в избытке","o":"Тула издавна славится самоварами: первые мастерские появились там в конце XVIII века, а в XIX веке город стал главным центром самоварного производства в России. Везти туда свой самовар нелепо.","v":"","s":"","q":[],"pic":""},{"p":"Хоть шаром покати","g":"poor","m":"совершенно пусто","o":"Так пусто и ровно, что можно прокатить шар, и он ни обо что не ударится. Выражение связывают с игрой в шары, которую устраивали на ровном пустом месте.","v":"","s":"","q":[],"pic":""},{"p":"Заварить кашу","g":"trouble","m":"затеять хлопотное, запутанное дело","o":"По одной из версий, «кашей» в старину называли и свадебный пир, и вообще большое общее угощение: «заварить кашу» — затеять большое хлопотное дело. А кто заварил, тот и «расхлёбывай».","v":"","s":"","q":[],"pic":""},{"p":"Мели, Емеля, — твоя неделя","g":"talk","m":"болтай сколько хочешь — твоим словам никто не верит","o":"Шутливая поговорка с игрой слов: «молоть» значит и «молоть зерно», и «болтать». По распространённому объяснению, на общей мельнице мололи по очереди, и, когда наступала «неделя» Емели, он мог молоть сколько угодно.","v":"","s":"","q":[],"pic":""},{"p":"Пускать пыль в глаза","g":"deceive","m":"хвастливо создавать ложное впечатление","o":"В кулачных боях и на скачках находились хитрецы, которые бросали в глаза противнику горсть пыли или поднимали за собой облако пыли, чтобы тот ничего не видел. Выигрывали обманом, а не силой.","v":"","s":"","q":[],"pic":""},{"p":"Бить в набат","g":"alarm","m":"поднимать тревогу","o":"Набат — тревожный частый колокольный звон, которым созывали народ при пожаре или нападении врагов. Само слово пришло из арабского через тюркские языки и сначала означало большой барабан.","v":"","s":"","q":[],"pic":""},{"p":"Ложка дёгтя в бочке мёда","g":"spoil","m":"маленькая неприятность, которая портит всё хорошее","o":"Дёготь — тёмная пахучая смола из берёзовой коры, ею смазывали колёса и сапоги. Даже ложка дёгтя испортит запах и вкус целой бочки мёда.","v":"","s":"","q":[],"pic":""},{"p":"Вешать лапшу на уши","g":"deceive","m":"обманывать, морочить голову","o":"Выражение появилось в XX веке, в просторечии. Откуда оно, точно неизвестно: убедительного объяснения у словарей нет, есть только догадки.","v":"","s":"","q":[],"pic":""},{"p":"Валять дурака","g":"idle","m":"дурачиться, притворяться непонимающим; бездельничать","o":"По одной из версий, выражение связано со скоморошьими представлениями: шут-«дурак» валялся, кувыркался и смешил публику. «Валять» здесь значит «изображать, разыгрывать».","v":"","s":"","q":[],"pic":""},{"p":"Аника-воин","g":"proud","m":"хвастун, храбрый на словах","o":"Аника-воин — герой русского духовного стиха и лубочных картинок XVII–XVIII веков. Он похвалялся своей силой, но не устоял перед Смертью.","v":"","s":"","q":[],"pic":""},{"p":"Кисейная барышня","g":"delicate","m":"изнеженная, ничего не умеющая девушка","o":"Кисея — тонкая прозрачная ткань для лёгких платьев. Выражение стало известным благодаря повести Н. Г. Помяловского «Мещанское счастье» (1861).","v":"","s":"","q":[],"pic":""},{"p":"Тришкин кафтан","g":"harm","m":"о неумелом исправлении, когда, устраняя одни недостатки, создают другие","o":"В басне Крылова Тришка, чтобы залатать продранные локти кафтана, обрезает на четверть рукава, а потом, чтобы надставить укоротившиеся рукава, обрезает фалды и полы.","v":"","s":"И. А. Крылов, «Тришкин кафтан» (1815)","q":[],"pic":""},{"p":"Демьянова уха","g":"insist","m":"навязчивое, неумеренное угощение","o":"В басне Крылова Демьян так усердно потчует соседа ухой, что тот убегает и больше к нему не приходит.","v":"","s":"И. А. Крылов, «Демьянова уха» (1813)","q":[],"pic":""},{"p":"Медвежья услуга","g":"harm","m":"неумелая помощь, которая приносит вред","o":"В басне Крылова медведь, желая согнать муху со лба спящего друга-пустынника, бьёт по мухе булыжником.","v":"","s":"И. А. Крылов, «Пустынник и Медведь» (1808)","q":[],"pic":""},{"p":"Слона-то я и не приметил","g":"overlook","m":"не заметить самого главного","o":"Герой басни Крылова побывал в Кунсткамере, подробно рассмотрел букашек и бабочек, а слона не заметил.","v":"","s":"И. А. Крылов, «Любопытный» (1814)","q":[],"pic":""},{"p":"А Васька слушает да ест","g":"indifferent","m":"виноватый не обращает внимания на упрёки и продолжает своё","o":"В басне Крылова повар долго стыдит кота Ваську, укравшего курчонка, а кот тем временем доедает жаркое.","v":"","s":"И. А. Крылов, «Кот и Повар» (1812)","q":[],"pic":""},{"p":"А воз и ныне там","g":"delay","m":"дело не движется","o":"В басне Крылова Лебедь, Рак и Щука тянут воз в разные стороны — Лебедь в облака, Рак назад, Щука в воду, — и воз не трогается с места.","v":"","s":"И. А. Крылов, «Лебедь, Щука и Рак» (1814)","q":[],"pic":""},{"p":"Остаться у разбитого корыта","g":"nothing","m":"потерять всё, что имел, остаться ни с чем","o":"В сказке Пушкина жадная старуха требует у золотой рыбки всё больше и больше — и в конце концов снова сидит у своего разбитого корыта.","v":"","s":"А. С. Пушкин, «Сказка о рыбаке и рыбке» (1833)","q":[],"pic":""},{"p":"Быть не в своей тарелке","g":"trouble","m":"чувствовать себя неловко, неуютно","o":"Неудачный перевод с французского: «n’être pas dans son assiette». Французское assiette значит не только «тарелка», но и «положение, состояние». Выражение встречается уже в «Горе от ума» Грибоедова и прижилось, хотя родилось из ошибки переводчика.","v":"","s":"","q":["Откуда взялась «тарелка»?","Из неточного перевода французского выражения","Из застольного этикета дворян","Из немецкой пословицы о посуде"],"pic":""},{"p":"Счастливые часов не наблюдают","g":"time","m":"счастливый человек не замечает времени","o":"Слова Софьи из комедии Грибоедова. У Шиллера в драме «Пикколомини» есть похожая мысль: «Для счастливого часы не бьют».","v":"","s":"А. С. Грибоедов, «Горе от ума»","q":[],"pic":""},{"p":"И дым Отечества нам сладок и приятен","g":"home","m":"всё родное мило, даже недостатки","o":"Слова Чацкого из «Горя от ума». Грибоедов цитирует Державина («Отечества и дым нам сладок и приятен»), а тот опирался на древних: Одиссей у Гомера мечтает увидеть хотя бы дым над родной Итакой.","v":"","s":"А. С. Грибоедов, «Горе от ума»; Г. Р. Державин, «Арфа»","q":[],"pic":""},{"p":"Свежо предание, а верится с трудом","g":"doubt","m":"о том, во что трудно поверить","o":"Слова Чацкого из «Горя от ума» — о временах, когда придворные, чтобы угодить, готовы были упасть и разбить себе затылок.","v":"","s":"А. С. Грибоедов, «Горе от ума»","q":[],"pic":""},{"p":"Кануть в Лету","g":"vanish","m":"исчезнуть бесследно, забыться","o":"В древнегреческих мифах Лета — река в подземном царстве. Души умерших пили из неё воду и забывали прежнюю жизнь.","v":"","s":"","q":[],"pic":""},{"p":"Ахиллесова пята","g":"weak","m":"уязвимое, слабое место","o":"Мать героя Ахилла, морская богиня Фетида, окунула младенца в воды Стикса, чтобы сделать неуязвимым, но держала его за пятку — та осталась незащищённой. В пятку Ахилла и попала смертельная стрела Париса.","v":"","s":"","q":[],"pic":""},{"p":"Ящик Пандоры","g":"source","m":"источник множества бед","o":"По мифу, боги дали первой женщине, Пандоре, сосуд со всеми бедами мира и запретили его открывать. Она не удержалась. У древнего поэта Гесиода это большой глиняный сосуд; «ящиком» он стал в XVI веке благодаря неточному переводу Эразма Роттердамского.","v":"","s":"Гесиод, «Труды и дни»","q":["Что открыла Пандора у древнего поэта Гесиода?","Большой глиняный сосуд","Деревянный сундук","Шкатулку из слоновой кости"],"pic":""},{"p":"Сизифов труд","g":"futile","m":"тяжёлая, бесконечная и бесполезная работа","o":"Хитрый царь Сизиф был наказан богами: в подземном царстве он вечно вкатывает на гору тяжёлый камень, который у самой вершины срывается вниз.","v":"","s":"","q":[],"pic":""},{"p":"Танталовы муки","g":"torment","m":"мучение от близости желанного, но недоступного","o":"Царь Тантал за свои преступления стоит в подземном царстве по горло в воде под ветвями с плодами. Когда он наклоняется напиться, вода уходит, когда тянется к плодам — ветви поднимаются.","v":"","s":"","q":[],"pic":""},{"p":"Авгиевы конюшни","g":"mess","m":"крайняя запущенность, беспорядок","o":"Огромные конюшни царя Авгия не чистились тридцать лет. Геракл очистил их за один день, направив через двор воды двух рек.","v":"","s":"","q":[],"pic":""},{"p":"Дамоклов меч","g":"danger","m":"постоянная угроза при внешнем благополучии","o":"Придворный Дамокл завидовал счастью сиракузского тирана Дионисия. Тот усадил его на пиру на своё место — а над головой Дамокла на конском волосе висел меч. Историю рассказывает Цицерон.","v":"","s":"Цицерон, «Тускуланские беседы»","q":[],"pic":""},{"p":"Яблоко раздора","g":"source","m":"причина спора","o":"Богиня раздора Эрида, не приглашённая на свадебный пир, подбросила золотое яблоко с надписью «Прекраснейшей». Спор Геры, Афины и Афродиты рассудил Парис — и это стало одной из причин Троянской войны.","v":"","s":"","q":[],"pic":""},{"p":"Перейти Рубикон","g":"decide","m":"принять бесповоротное решение","o":"Рубикон — речка, по которой проходила граница римской провинции. В 49 году до н. э. Юлий Цезарь с войском перешёл её вопреки запрету сената — это означало начало гражданской войны.","v":"","s":"","q":[],"pic":""},{"p":"Прокрустово ложе","g":"force","m":"мерка, под которую насильно подгоняют что-либо","o":"Разбойник Прокруст укладывал путников на своё ложе: тем, кто был длиннее, отрубал ноги, а коротких вытягивал.","v":"","s":"","q":[],"pic":""},{"p":"Нить Ариадны","g":"guide","m":"путеводная нить, способ выйти из трудного положения","o":"Царевна Ариадна дала Тесею клубок ниток. Разматывая его, герой вошёл в лабиринт, победил Минотавра и по нити нашёл дорогу назад.","v":"","s":"","q":[],"pic":""},{"p":"Разрубить гордиев узел","g":"decide","m":"решить сложное дело одним смелым действием","o":"Фригийский царь Гордий завязал хитроумный узел; предсказание обещало тому, кто его развяжет, власть над Азией. Александр Македонский не стал распутывать узел, а разрубил его мечом (333 год до н. э.).","v":"","s":"","q":[],"pic":""},{"p":"Пиррова победа","g":"victory","m":"победа, которая обошлась слишком дорого","o":"Эпирский царь Пирр в 279 году до н. э. разбил римлян при Аускуле, но потерял столько воинов, что, по преданию, сказал: «Ещё одна такая победа — и я останусь без войска».","v":"","s":"","q":[],"pic":""},{"p":"Троянский конь","g":"danger","m":"коварный подарок, скрытая угроза","o":"Греки, осаждавшие Трою, оставили у её стен огромного деревянного коня, в котором спрятались воины. Троянцы втащили «подарок» в город, и ночью греки открыли ворота своему войску.","v":"","s":"","q":[],"pic":""},{"p":"Рог изобилия","g":"plenty","m":"неисчерпаемое богатство, изобилие","o":"Младенца Зевса вскормила молоком коза Амалфея. По мифу, её рог мог наполняться всем, чего пожелает владелец.","v":"","s":"","q":[],"pic":""},{"p":"Буриданов осёл","g":"choice","m":"человек, неспособный выбрать между равноценными вариантами","o":"Осёл стоит между двумя одинаковыми охапками сена и умирает от голода, не в силах выбрать. Пример приписывают средневековому философу Жану Буридану, но в его сочинениях такого примера нет; сама мысль восходит ещё к Аристотелю.","v":"","s":"","q":[],"pic":""},{"p":"Козёл отпущения","g":"blame","m":"тот, на кого сваливают чужую вину","o":"По библейскому обряду, первосвященник возлагал руки на голову козла, как бы перекладывая на него грехи народа, и отпускал животное в пустыню.","v":"","s":"Левит, 16","q":[],"pic":""},{"p":"Ждать как манны небесной","g":"wait","m":"ждать с нетерпением, как спасения","o":"По Библии, когда евреи сорок лет шли по пустыне, Бог посылал им с неба пищу — манну.","v":"","s":"Исход, 16","q":[],"pic":""},{"p":"Вавилонское столпотворение","g":"mess","m":"беспорядок, суматоха, толчея","o":"По библейскому рассказу, люди начали строить в Вавилоне башню до неба. Бог смешал их языки, строители перестали понимать друг друга, и стройка остановилась. «Столпотворение» — от «творить столп», строить башню.","v":"","s":"Бытие, 11","q":[],"pic":""},{"p":"Святая святых","g":"secret","m":"самое заветное, недоступное для посторонних","o":"Так называлась самая сокровенная часть скинии — походного святилища израильтян, а потом и Иерусалимского храма. Входить туда мог только первосвященник, и лишь раз в год.","v":"","s":"Исход, 26:33–34; Левит, 16; Послание к Евреям, 9:3–7","q":[],"pic":""},{"p":"Зарыть талант в землю","g":"waste","m":"не развить свои способности","o":"В евангельской притче хозяин раздал слугам таланты — так называлась крупная денежная мера. Один слуга не пустил деньги в дело, а закопал. Значение «дарование» слово «талант» получило именно благодаря этой притче.","v":"","s":"Евангелие от Матфея, 25","q":[],"pic":""},{"p":"Метать бисер перед свиньями","g":"futile","m":"напрасно говорить о важном с тем, кто не способен этого оценить","o":"Слова из Нагорной проповеди. «Бисер» в церковнославянском языке — жемчуг.","v":"","s":"Евангелие от Матфея, 7:6","q":["Что значит «бисер» в церковнославянском языке?","Жемчуг","Мелкие стеклянные бусины","Зёрна пшеницы"],"pic":""},{"p":"Глас вопиющего в пустыне","g":"futile","m":"напрасный призыв, оставшийся без ответа","o":"Так пророк Исаия, а за ним и евангелисты, говорят о голосе, зовущем в пустыне приготовить путь Господу. Там этот голос услышан; в нашей речи выражение стало означать призыв, на который никто не откликается.","v":"","s":"Книга пророка Исаии, 40:3","q":[],"pic":""},{"p":"Блудный сын","g":"return","m":"тот, кто после долгих скитаний и ошибок вернулся домой","o":"В евангельской притче младший сын забрал свою долю наследства, растратил её на чужбине и вернулся к отцу с покаянием. Отец встретил его с радостью.","v":"","s":"Евангелие от Луки, 15","q":[],"pic":""},{"p":"Умывать руки","g":"blame","m":"снимать с себя ответственность","o":"Перед казнью Христа Понтий Пилат умыл руки перед народом и сказал: «Невиновен я в крови праведника сего».","v":"","s":"Евангелие от Матфея, 27:24","q":[],"pic":""},{"p":"Альфа и омега","g":"whole","m":"начало и конец, самое главное","o":"Альфа — первая, омега — последняя буква греческого алфавита. В Откровении Иоанна Богослова сказано: «Я есмь Альфа и Омега, начало и конец».","v":"","s":"Откровение, 1:8","q":[],"pic":""},{"p":"Соль земли","g":"best","m":"лучшие люди, опора общества","o":"Слова Христа ученикам в Нагорной проповеди: «Вы — соль земли».","v":"","s":"Евангелие от Матфея, 5:13","q":[],"pic":""},{"p":"Не от мира сего","g":"unusual","m":"о человеке мечтательном, далёком от житейских забот","o":"Слова Христа Пилату: «Царство Моё не от мира сего».","v":"","s":"Евангелие от Иоанна, 18:36","q":[],"pic":""},{"p":"Вернуться на круги своя","g":"return","m":"вернуться к прежнему положению","o":"Из книги Екклесиаста. В церковнославянском тексте сказано: «…и на круги своя обращается дух» (в синодальном переводе — «и возвращается ветер на круги свои»). «Круги» — привычный путь, «своя» — старая форма слова «свои».","v":"","s":"Екклесиаст, 1:6","q":[],"pic":""},{"p":"Тридцать сребреников","g":"betray","m":"плата за предательство","o":"По Евангелию, Иуда предал Христа за тридцать серебряных монет — сребреников.","v":"","s":"Евангелие от Матфея, 26:15","q":[],"pic":""},{"p":"Камень преткновения","g":"obstacle","m":"главное препятствие, трудность","o":"Библейское выражение: «преткнуться» значит «споткнуться». Камень преткновения — камень, о который спотыкаются на пути.","v":"","s":"Книга пророка Исаии, 8:14; Послание к Римлянам, 9:32","q":[],"pic":""},{"p":"Злоба дня","g":"topic","m":"то, что особенно волнует всех в данный момент","o":"Из Евангелия: «Довлеет дневи злоба его» — «довольно для каждого дня своей заботы». «Злоба» в церковнославянском — «забота, тягота», а не «злость».","v":"","s":"Евангелие от Матфея, 6:34","q":["Что значит «злоба» в церковнославянском тексте?","Забота, тягота","Ненависть","Злая шутка"],"pic":""},{"p":"Притча во языцех","g":"topic","m":"то, о чём все говорят","o":"Библейское выражение: «языцы» — народы. Стать «притчей во всех народах» — сделаться предметом всеобщих разговоров (обычно с осуждением).","v":"","s":"Второзаконие, 28:37","q":[],"pic":""},{"p":"Как Мамай прошёл","g":"mess","m":"полный разгром, беспорядок","o":"Мамай — военачальник Золотой Орды, войско которого Дмитрий Донской разбил на Куликовом поле в 1380 году. Набеги Мамая оставляли после себя разорённые земли.","v":"","s":"","q":[],"pic":""},{"p":"Во всю ивановскую","g":"loud","m":"очень громко","o":"По распространённому объяснению, на Ивановской площади в Московском Кремле, у колокольни Ивана Великого, дьяки зачитывали царские указы так громко, чтобы слышала вся площадь, — «во всю ивановскую». По другой версии, выражение связано с праздничным звоном во все колокола колокольни Ивана Великого.","v":"","s":"","q":[],"pic":""},{"p":"Коломенская верста","g":"tall","m":"о человеке очень высокого роста","o":"При царе Алексее Михайловиче на дороге из Москвы в его летнюю резиденцию, село Коломенское, поставили очень высокие верстовые столбы.","v":"","s":"","q":[],"pic":"versta"},{"p":"Казанская сирота","g":"false","m":"человек, притворяющийся несчастным, чтобы разжалобить","o":"После взятия Казани в 1552 году татарские мурзы, поступив на службу к Ивану Грозному, жаловались на своё сиротство и бедность, чтобы получить от царя милости.","v":"","s":"","q":[],"pic":""},{"p":"Потёмкинские деревни","g":"fake","m":"показное благополучие, за которым ничего нет","o":"По легенде, в 1787 году князь Потёмкин, показывая Екатерине II Новороссию и Крым, велел построить вдоль её пути нарядные декорации деревень. Слух распространил саксонский дипломат Гельбиг; историки считают его сильно преувеличенным.","v":"","s":"","q":[],"pic":""},{"p":"Иван, не помнящий родства","g":"ungrateful","m":"человек, забывший свои корни, не чтящий прошлого","o":"Так в XIX веке называли себя пойманные беглые каторжники и бродяги, скрывая своё настоящее имя. В документах их записывали «Иванами, родства не помнящими».","v":"","s":"","q":[],"pic":""},{"p":"Не по Сеньке шапка","g":"rank","m":"не по чину, не по заслугам","o":"В старой Руси высокая меховая шапка — знак знатности. Сенька — обычный простолюдин, и боярская шапка ему не по чину.","v":"","s":"","q":[],"pic":""},{"p":"Бить челом","g":"ask","m":"почтительно просить","o":"Просящий кланялся до земли, касаясь её лбом — «челом». Отсюда и «челобитная» — письменная просьба на имя царя.","v":"","s":"","q":[],"pic":""}],"latin":[{"la":"Memento mori","r":"Помни о смерти","p":"мэмэ́нто мо́ри","a":"Приветствие монахов-отшельников XVII в. (французских паулинов, «братьев смерти»; по другим сведениям — траппистов)","n":"Напоминание о том, что жизнь скоротечна и надо жить достойно. Любимый сюжет старых художников: череп, свеча, песочные часы на картине.","g":"death"},{"la":"Carpe diem","r":"Лови день; живи настоящим","p":"ка́рпэ ди́эм","a":"Гораций, «Оды», I, 11","n":"У Горация полностью: «Лови день, меньше всего веря в завтрашний». Не призыв к легкомыслию, а совет ценить сегодняшний день.","g":"time"},{"la":"Alea iacta est","r":"Жребий брошен","p":"а́лэа я́кта эст","a":"Юлий Цезарь, 49 г. до н. э., при переходе через Рубикон (по Светонию)","n":"Говорят, когда принято бесповоротное решение. По Плутарху, Цезарь произнёс эти слова по-гречески.","g":"decide"},{"la":"Veni, vidi, vici","r":"Пришёл, увидел, победил","p":"вэ́ни, ви́ди, ви́ци","a":"Юлий Цезарь, 47 г. до н. э., в письме о быстрой победе над понтийским царём Фарнаком","n":"О деле, сделанном быстро и успешно.","g":"victory"},{"la":"Errare humanum est","r":"Человеку свойственно ошибаться","p":"эрра́рэ хума́нум эст","a":"Мысль встречается у Цицерона и Сенеки; латинская формула — более поздняя","n":"Позднее появилось продолжение: «…но упорствовать в ошибке — дьявольское дело».","g":"people"},{"la":"Per aspera ad astra","r":"Через тернии к звёздам","p":"пэр а́спэра ад а́стра","a":"Восходит к Сенеке: «Нет лёгкого пути с земли к звёздам»","n":"Путь к высокой цели лежит через трудности.","g":"effort"},{"la":"Festina lente","r":"Спеши медленно","p":"фэсти́на ле́нтэ","a":"Любимое изречение императора Августа (по Светонию, по-гречески)","n":"Делай быстро, но обдуманно. Русский аналог — «Тише едешь — дальше будешь».","g":"patience"},{"la":"Divide et impera","r":"Разделяй и властвуй","p":"ди́видэ эт и́мпэра","a":"Принцип римской политики; латинская формула появилась в Новое время","n":"Ссорь противников между собой — и легче справишься с каждым.","g":"power"},{"la":"Dum spiro, spero","r":"Пока дышу, надеюсь","p":"дум спи́ро, спэ́ро","a":"Восходит к Цицерону («Пока есть жизнь, есть и надежда»)","n":"Девиз оптимистов.","g":"hope"},{"la":"Sic transit gloria mundi","r":"Так проходит мирская слава","p":"сик тра́нзит гло́риа му́нди","a":"Слова из обряда возведения на престол римского папы (с 1409 г.); ср. у Фомы Кемпийского («О подражании Христу»): «O quam cito transit gloria mundi»","n":"При обряде перед новым папой сжигали пучок пакли, напоминая, как быстротечна земная слава.","g":"death"},{"la":"Si vis pacem, para bellum","r":"Хочешь мира — готовься к войне","p":"си вис па́цэм, па́ра бэ́ллюм","a":"Восходит к римскому военному писателю Вегецию (IV–V вв.)","n":"У Вегеция мысль выражена иначе: «Кто желает мира, пусть готовится к войне».","g":"power"},{"la":"Mens sana in corpore sano","r":"В здоровом теле — здоровый дух","p":"мэнс са́на ин ко́рпорэ са́но","a":"Ювенал, «Сатиры», X","n":"У Ювенала смысл другой: «Надо молить богов, чтобы ум был здравым в теле здоровом». То есть одно не гарантирует другого — этого нужно желать и добиваться.","g":"health"},{"la":"Panem et circenses","r":"Хлеба и зрелищ","p":"па́нэм эт цирцэ́нзэс","a":"Ювенал, «Сатиры», X","n":"Поэт с горечью писал, что римский народ, когда-то решавший судьбы государства, теперь желает лишь двух вещей — хлеба и цирковых игр.","g":"crowd"},{"la":"Quo vadis?","r":"Камо грядеши? (Куда идёшь?)","p":"кво ва́дис","a":"Евангелие от Иоанна, 13:36; апокрифические «Деяния Петра»","n":"По преданию, апостол Пётр, уходя из Рима от гонений, встретил Христа и спросил его: «Куда идёшь, Господи?» Так называется и роман Г. Сенкевича.","g":"question"},{"la":"Tertium non datur","r":"Третьего не дано","p":"тэ́рциум нон да́тур","a":"Формула логики (закон исключённого третьего)","n":"Из двух противоположных утверждений одно истинно: либо так, либо не так.","g":"logic"},{"la":"Dura lex, sed lex","r":"Закон суров, но это закон","p":"ду́ра лекс, сэд лекс","a":"Восходит к римскому юристу Ульпиану","n":"Закон надо исполнять, даже если он кажется суровым.","g":"law"},{"la":"In vino veritas","r":"Истина в вине","p":"ин ви́но вэ́ритас","a":"Восходит к греческому поэту Алкею; у Плиния Старшего: «истину стали приписывать вину»; сама формула позднейшая (есть у Эразма Роттердамского)","n":"Подвыпивший человек говорит то, что думает. Не похвала вину!","g":"truth"},{"la":"Repetitio est mater studiorum","r":"Повторение — мать учения","p":"рэпэти́цио эст ма́тэр студио́рум","a":"Средневековая школьная поговорка","n":"Лучший девиз для ежедневной зарядки.","g":"learn"},{"la":"Verba volant, scripta manent","r":"Слова улетают, написанное остаётся","p":"вэ́рба во́лянт, скри́пта ма́нэнт","a":"Латинская пословица","n":"Договорённость лучше закрепить письменно.","g":"word"},{"la":"Nulla dies sine linea","r":"Ни дня без строчки","p":"ну́лля ди́эс си́нэ ли́нэа","a":"Плиний Старший рассказывает, что художник Апеллес не проводил ни дня, не нарисовав хотя бы линии","n":"Значит, «строчка» изначально была линией на рисунке. Совет: занимайтесь понемногу, но каждый день.","g":"learn"},{"la":"Docendo discimus","r":"Уча, учимся","p":"доцэ́ндо ди́сцимус","a":"Восходит к Сенеке («Письма к Луцилию»)","n":"Объясняя другим, лучше понимаешь сам.","g":"learn"},{"la":"Non scholae, sed vitae discimus","r":"Учимся не для школы, а для жизни","p":"нон схо́лэ, сэд ви́тэ ди́сцимус","a":"Перевёрнутые слова Сенеки","n":"У Сенеки было наоборот: «Учимся не для жизни, а для школы» — он упрекал философов в пустом учёном многословии. Позже фразу переделали в поучение.","g":"learn"},{"la":"Scientia potentia est","r":"Знание — сила","p":"сциэ́нциа потэ́нциа эст","a":"Восходит к Фрэнсису Бэкону (1597)","n":"У Бэкона: «Ipsa scientia potestas est» — «Знание само по себе есть сила». Так называется и научно-популярный журнал, выходящий с 1926 года.","g":"knowledge"},{"la":"Finis coronat opus","r":"Конец — делу венец","p":"фи́нис коро́нат о́пус","a":"Латинская пословица","n":"О деле судят по результату.","g":"result"},{"la":"Gutta cavat lapidem","r":"Капля камень точит","p":"гу́тта ка́ват ля́пидэм","a":"Овидий, «Письма с Понта»","n":"Упорство и постоянство преодолевают любые трудности.","g":"effort"},{"la":"Manus manum lavat","r":"Рука руку моет","p":"ма́нус ма́нум ля́ват","a":"Встречается у Петрония и Сенеки","n":"В древности — о взаимной помощи; сегодня чаще с неодобрением — о круговой поруке.","g":"mutual"},{"la":"Sapienti sat","r":"Умному достаточно","p":"сапиэ́нти сат","a":"Плавт, Теренций","n":"Говорят, когда не хотят договаривать: умный и так поймёт.","g":"word"},{"la":"Suum cuique","r":"Каждому своё (каждому — по заслугам)","p":"су́ум ку́иквэ","a":"Цицерон; принцип римского права","n":"Каждому — по его заслугам. Немецкий перевод этих слов нацисты поместили на ворота концлагеря Бухенвальд, поэтому в Германии выражение употребляют с осторожностью.","g":"law"},{"la":"Quod licet Iovi, non licet bovi","r":"Что позволено Юпитеру, не позволено быку","p":"квод ли́цэт йо́ви, нон ли́цэт бо́ви","a":"Латинская поговорка неясного происхождения (в печати отмечена с XVIII в.); ср. у Теренция: «Aliis si licet, tibi non licet»","n":"Что можно одному, нельзя другому. Связывают с мифом о том, как Юпитер обернулся быком, чтобы похитить Европу.","g":"rank"},{"la":"O tempora! O mores!","r":"О времена! О нравы!","p":"о тэ́мпора, о мо́рэс","a":"Цицерон, речь против Катилины (63 г. до н. э.)","n":"Возглас возмущения испорченностью нравов. Сегодня чаще звучит шутливо.","g":"time"},{"la":"Ars longa, vita brevis","r":"Жизнь коротка, искусство вечно","p":"арс ло́нга, ви́та брэ́вис","a":"Гиппократ, «Афоризмы» (латинский перевод)","n":"У Гиппократа речь о врачебном искусстве: «Жизнь коротка, путь искусства долог». Врачу не хватит жизни, чтобы познать всё.","g":"time"},{"la":"Homo homini lupus est","r":"Человек человеку волк","p":"хо́мо хо́мини лю́пус эст","a":"Плавт, комедия «Ослы»","n":"У Плавта: «Человек человеку волк, если он его не знает». Прославил философ Томас Гоббс. Мысль о жестокости людей друг к другу.","g":"people"},{"la":"Audi alteram partem","r":"Выслушай и другую сторону","p":"а́уди а́льтэрам па́ртэм","a":"Принцип римского права","n":"Прежде чем судить, выслушай обе стороны.","g":"law"},{"la":"De gustibus non est disputandum","r":"О вкусах не спорят","p":"дэ гу́стибус нон эст диспута́ндум","a":"Средневековая поговорка","n":"У каждого свой вкус.","g":"taste"},{"la":"Ex nihilo nihil fit","r":"Из ничего ничего не происходит","p":"экс ни́хило ни́хиль фит","a":"Восходит к Лукрецию, поэма «О природе вещей»","n":"Всё имеет свою причину; без труда нет и результата.","g":"logic"},{"la":"Post hoc, ergo propter hoc","r":"После этого — значит, вследствие этого","p":"пост хок, э́рго про́птэр хок","a":"Название логической ошибки","n":"Если одно случилось после другого, это ещё не значит, что одно — причина другого.","g":"logic"},{"la":"Primum non nocere","r":"Прежде всего — не навреди","p":"при́мум нон ноцэ́рэ","a":"Принцип врачебной этики; восходит к Гиппократу («Эпидемии»)","n":"У Гиппократа: «помогать — или по крайней мере не вредить». Латинская формула сложилась гораздо позже.","g":"medicine"},{"la":"Medice, cura te ipsum","r":"Врач, исцели самого себя","p":"мэ́дицэ, ку́ра тэ и́псум","a":"Евангелие от Луки, 4:23","n":"Прежде чем учить других, исправь собственные недостатки.","g":"medicine"},{"la":"Medicus curat, natura sanat","r":"Врач лечит, природа исцеляет","p":"мэ́дикус ку́рат, нату́ра са́нат","a":"Приписывается Гиппократу","n":"Врач помогает силам самого организма.","g":"medicine"},{"la":"Aliis inserviendo consumor","r":"Светя другим, сгораю сам","p":"а́лиис инсэрвиэ́ндо консу́мор","a":"Девиз голландского врача Николаса Тульпа (XVII в.)","n":"Тульп предложил сделать символом врача горящую свечу. Дословно: «Служа другим, расточаю себя».","g":"medicine"},{"la":"Cito, tuto et iucunde","r":"Быстро, безопасно и приятно","p":"ци́то, ту́то эт юку́ндэ","a":"Восходит к Асклепиаду Вифинскому, греческому врачу в Риме (I в. до н. э.); у Цельса («О медицине», III, 4): лечить «tuto, celeriter, iucunde» — безопасно, быстро и приятно","n":"Принцип лечения: лечить быстро, безопасно и без лишних страданий. Слово «cito!» («срочно!») до сих пор пишут на рецептах и направлениях.","g":"medicine"},{"la":"Invia est in medicina via sine lingua Latina","r":"Непроходим путь в медицине без латинского языка","p":"и́нвиа эст ин мэдици́на ви́а си́нэ ли́нгва ляти́на","a":"Поговорка студентов-медиков","n":"Названия болезней, лекарств и частей тела до сих пор латинские.","g":"medicine"},{"la":"Optimum medicamentum quies est","r":"Лучшее лекарство — покой","p":"о́птимум мэдикамэ́нтум кви́эс эст","a":"Приписывается римскому врачу Авлу Корнелию Цельсу","n":"Отдых и сон — тоже лечение.","g":"medicine"},{"la":"Quantum satis","r":"Сколько нужно","p":"ква́нтум са́тис","a":"Рецептурная формула","n":"В старых рецептах сокращённо q. s.: «взять сколько потребуется». Сейчас так пишут и в кулинарных книгах.","g":"medicine"},{"la":"Omnia mea mecum porto","r":"Всё моё ношу с собой","p":"о́мниа мэ́а мэ́кум по́рто","a":"Приписывается древнегреческому мудрецу Бианту (по Цицерону)","n":"Когда враги захватили город, жители бежали, унося имущество. Биант шёл налегке: его богатство — знания и ум.","g":"knowledge"},{"la":"Cogito, ergo sum","r":"Мыслю, следовательно, существую","p":"ко́гито, э́рго сум","a":"Рене Декарт, «Начала философии» (1644)","n":"Сомневаться можно во всём, кроме того, что сомневающийся существует.","g":"logic"},{"la":"Amicus Plato, sed magis amica veritas","r":"Платон мне друг, но истина дороже","p":"ами́кус пля́то, сэд ма́гис ами́ка вэ́ритас","a":"Восходит к Аристотелю («Никомахова этика»)","n":"Аристотель спорил со своим учителем Платоном. Истина важнее авторитета, даже самого уважаемого.","g":"truth"},{"la":"Homo sum, humani nihil a me alienum puto","r":"Я человек, и ничто человеческое мне не чуждо","p":"хо́мо сум, хума́ни ни́хиль а мэ алиэ́нум пу́то","a":"Теренций, комедия «Самоистязатель»","n":"Карл Маркс назвал это изречение своим любимым. В древности его цитировали Цицерон и Сенека.","g":"people"},{"la":"Nosce te ipsum","r":"Познай самого себя","p":"но́сцэ тэ и́псум","a":"Латинский перевод надписи на храме Аполлона в Дельфах","n":"Мудрость начинается с понимания самого себя.","g":"knowledge"},{"la":"Tempora mutantur, et nos mutamur in illis","r":"Времена меняются, и мы меняемся вместе с ними","p":"тэ́мпора мута́нтур, эт нос мута́мур ин и́ллис","a":"Латинская стихотворная поговорка XVI века","n":"Об изменчивости жизни и людей.","g":"time"},{"la":"Labor omnia vincit","r":"Труд всё побеждает","p":"ля́бор о́мниа ви́нцит","a":"Восходит к Вергилию, «Георгики»","n":"У Вергилия: «Труд упорный всё победил».","g":"effort"},{"la":"Fortes fortuna adiuvat","r":"Смелым помогает судьба","p":"фо́ртэс форту́на а́дъюват","a":"Теренций, комедия «Формион»","n":"Русский аналог — «Смелость города берёт».","g":"courage"},{"la":"Mea culpa","r":"Моя вина","p":"мэ́а ку́льпа","a":"Католическая покаянная молитва","n":"Признание своей ошибки — и сегодня часто шутливое.","g":"error"},{"la":"Nota bene","r":"Заметь хорошо; обрати внимание","p":"но́та бэ́нэ","a":"Пометка на полях","n":"Сокращённо NB. Отсюда русское «нотабене» — важное замечание.","g":"note"},{"la":"Post scriptum","r":"После написанного","p":"пост скри́птум","a":"Пометка в письмах","n":"Сокращённо P. S. — приписка после подписи.","g":"note"},{"la":"Alma mater","r":"Кормящая мать (о своём учебном заведении)","p":"а́льма ма́тэр","a":"Так студенты называли университет, дающий «духовную пищу»","n":"Так с любовью называют свой институт или университет.","g":"learn"},{"la":"Terra incognita","r":"Неизвестная земля","p":"тэ́рра инко́гнита","a":"Надпись на старинных картах на месте неисследованных земель","n":"Об области знаний, совершенно незнакомой человеку.","g":"unknown"},{"la":"Tabula rasa","r":"Чистая доска","p":"та́буля ра́за","a":"Восходит к Аристотелю; прославил Джон Локк","n":"Римляне писали на табличках, покрытых воском; стёртая табличка — чистая. Отсюда — «начать с чистого листа».","g":"start"},{"la":"Persona non grata","r":"Нежелательное лицо","p":"пэрсо́на нон гра́та","a":"Дипломатический термин","n":"Иностранный дипломат, которого страна отказывается принимать. В шутку — о нежеланном госте.","g":"people"},{"la":"Status quo","r":"Существующее положение","p":"ста́тус кво","a":"Дипломатический термин","n":"Сохранить статус-кво — оставить всё как есть.","g":"state"},{"la":"Alter ego","r":"Второе «я»","p":"а́льтэр э́го","a":"Приписывается Пифагору или Зенону; употреблял Цицерон","n":"Близкий друг, понимающий тебя как самого себя; или вторая сторона характера.","g":"people"},{"la":"Deus ex machina","r":"Бог из машины","p":"дэ́ус экс ма́хина","a":"Древний театр","n":"В античном театре бога, разрешавшего запутанный сюжет, спускали на сцену особым подъёмным механизмом. О неожиданной развязке.","g":"chance"},{"la":"Perpetuum mobile","r":"Вечный двигатель","p":"пэрпэ́туум мо́биле","a":"Средневековые изобретатели","n":"Машина, работающая без источника энергии, невозможна — это противоречит законам физики. С 1775 года Парижская академия наук не рассматривает такие проекты.","g":"unknown"},{"la":"Ab ovo","r":"С самого начала (букв. «от яйца»)","p":"аб о́во","a":"Гораций, «Наука поэзии»","n":"Гораций советовал поэтам не начинать рассказ о Троянской войне «от яйца» — от рождения Елены из яйца Леды.","g":"start"},{"la":"Ave, Caesar, morituri te salutant","r":"Здравствуй, Цезарь, идущие на смерть приветствуют тебя","p":"а́вэ, цэ́зар, мориту́ри тэ салю́тант","a":"Светоний, «Жизнь двенадцати цезарей» (Клавдий, 21); у Светония: «Ave, imperator, morituri te salutant»","n":"Так приветствовали императора Клавдия участники морского сражения-представления в 52 г. н. э. Сегодня — шутливо перед трудным испытанием, например экзаменом.","g":"courage"},{"la":"Et tu, Brute?","r":"И ты, Брут?","p":"эт ту, бру́тэ","a":"У. Шекспир, «Юлий Цезарь»","n":"По Светонию, Цезарь умер молча, но «некоторые передают», что Бруту он сказал по-гречески: «И ты, дитя моё?» Латинская формула прославилась благодаря Шекспиру.","g":"betray"},{"la":"Carthago delenda est","r":"Карфаген должен быть разрушен","p":"карта́го дэле́нда эст","a":"Катон Старший, II в. до н. э. (в античных источниках — «Carthaginem esse delendam»; краткая формула позднейшая)","n":"Катон заканчивал этими словами любую свою речь в сенате, о чём бы ни говорил. Так говорят о настойчиво повторяемом требовании.","g":"insist"},{"la":"Pecunia non olet","r":"Деньги не пахнут","p":"пэку́ниа нон о́лет","a":"Восходит к рассказу Светония о Веспасиане; сама формула позднейшая","n":"Сын упрекнул Веспасиана за налог на общественные уборные. Император поднёс к его носу монету из первых сборов и спросил, пахнет ли она.","g":"money"},{"la":"Vae victis","r":"Горе побеждённым","p":"вэ ви́ктис","a":"Вождь галлов Бренн, 390 г. до н. э. (по Титу Ливию)","n":"Когда римляне выплачивали выкуп и пожаловались на неверные гири, Бренн бросил на весы ещё и свой меч.","g":"power"},{"la":"Gaudeamus igitur","r":"Итак, будем веселиться","p":"гаудэа́мус и́гитур","a":"Первые слова студенческого гимна (XVIII в.)","n":"Песню до сих пор поют на студенческих праздниках.","g":"joy"},{"la":"Lupus in fabula","r":"Лёгок на помине (букв. «волк в басне»)","p":"лю́пус ин фа́буля","a":"Теренций, комедия «Братья»","n":"Говорят, когда появляется тот, о ком только что шла речь.","g":"chance"},{"la":"Omnia vincit amor","r":"Любовь побеждает всё","p":"о́мниа ви́нцит а́мор","a":"Вергилий, «Буколики», X","n":"Одна из самых известных строк римской поэзии.","g":"love"},{"la":"Amor non est medicabilis herbis","r":"Любовь травами не лечится","p":"а́мор нон эст мэдика́билис хэ́рбис","a":"Овидий, «Героиды»","n":"От любви нет лекарства — даже у врача.","g":"love"},{"la":"Usus est optimus magister","r":"Опыт — лучший учитель","p":"у́зус эст о́птимус маги́стэр","a":"Восходит к Цицерону (речь «В защиту Рабирия Постума»): «usus magister est optimus»","n":"Рус

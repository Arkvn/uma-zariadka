льно.","g":"learn"},{"la":"Multum in parvo","r":"Многое в малом","p":"му́льтум ин па́рво","a":"Латинская поговорка","n":"О кратком, но содержательном.","g":"learn"},{"la":"Plenus venter non studet libenter","r":"Сытое брюхо к учению глухо","p":"пле́нус вэ́нтэр нон сту́дэт либэ́нтэр","a":"Средневековая школьная поговорка","n":"Дословно: «Полный живот неохотно учится».","g":"learn"},{"la":"Qui quaerit, reperit","r":"Кто ищет, тот находит","p":"кви квэ́рит, рэ́пэрит","a":"Восходит к Евангелию от Матфея, 7:8","n":"Русская форма знакома по песне из фильма «Дети капитана Гранта»: «Кто ищет, тот всегда найдёт».","g":"effort"},{"la":"Aut Caesar, aut nihil","r":"Или Цезарь, или ничто","p":"а́ут цэ́зар, а́ут ни́хиль","a":"Девиз Чезаре Борджиа (XV–XVI вв.)","n":"Всё или ничего.","g":"power"},{"la":"Natura abhorret vacuum","r":"Природа не терпит пустоты","p":"нату́ра абхо́ррэт ва́куум","a":"Восходит к Аристотелю; латинская формула средневековая","n":"Сегодня так говорят и о жизни: свободное место непременно чем-то займут.","g":"logic"},{"la":"Sapere aude","r":"Дерзай знать; имей мужество думать своим умом","p":"са́пэрэ а́удэ","a":"Гораций, «Послания»","n":"Философ Кант сделал эти слова девизом эпохи Просвещения.","g":"knowledge"},{"la":"Otium post negotium","r":"Отдых после дела","p":"о́циум пост нэго́циум","a":"Латинская пословица","n":"Русский аналог — «Сделал дело — гуляй смело».","g":"rest"},{"la":"Citius, altius, fortius","r":"Быстрее, выше, сильнее","p":"ци́циус, а́льциус, фо́рциус","a":"Олимпийский девиз, предложенный Пьером де Кубертеном (автор — священник Анри Дидон)","n":"В 2021 году к девизу добавили слово «Communiter» — «Вместе».","g":"effort"},{"la":"Urbi et orbi","r":"Городу и миру","p":"у́рби эт о́рби","a":"Благословение римского папы","n":"Так папа обращается к Риму и ко всему миру. В шутку — «во всеуслышание».","g":"crowd"},{"la":"Vale!","r":"Будь здоров! Прощай!","p":"ва́ле","a":"Обычное римское прощание","n":"Им заканчивали письма. Ср. русское «Будь здоров!».","g":"greet"},{"la":"Ubi bene, ibi patria","r":"Где хорошо, там и родина","p":"у́би бэ́нэ, и́би па́триа","a":"Восходит к римскому поэту Пакувию (в передаче Цицерона)","n":"Так говорят о тех, кто ищет лучшей доли, — часто с осуждением. У Цицерона мысль звучит одобрительно: мудрец везде у себя дома.","g":"home"},{"la":"Mens agitat molem","r":"Мысль движет материю","p":"мэнс а́гитат мо́лем","a":"Вергилий, «Энеида», VI","n":"Дух оживляет и движет мир. Девиз нескольких университетов.","g":"knowledge"},{"la":"Nemo omnia potest scire","r":"Никто не может знать всё","p":"нэ́мо о́мниа по́тэст сци́рэ","a":"Латинская пословица","n":"Не стыдно не знать — стыдно не учиться.","g":"knowledge"},{"la":"Exegi monumentum","r":"Я воздвиг памятник","p":"экзэ́ги монумэ́нтум","a":"Гораций, «Оды», III, 30","n":"Ода Горация о бессмертии поэта. По её мотивам написаны «Памятник» Державина и пушкинское «Я памятник себе воздвиг нерукотворный» — с латинским эпиграфом из Горация.","g":"result"},{"la":"Fiat lux","r":"Да будет свет","p":"фи́ат люкс","a":"Бытие, 1:3 (латинский перевод Библии)","n":"Первые слова Бога при сотворении мира.","g":"start"},{"la":"Ecce homo","r":"Се человек (вот человек)","p":"э́ккэ хо́мо","a":"Евангелие от Иоанна, 19:5","n":"Слова Пилата, выведшего к народу Христа в терновом венце. Так называются многие картины.","g":"people"},{"la":"In dubio pro reo","r":"Сомнение толкуется в пользу обвиняемого","p":"ин ду́био про рэ́о","a":"Принцип права","n":"Неустранимые сомнения в виновности толкуются в пользу обвиняемого; это часть презумпции невиновности.","g":"law"},{"la":"Omne ignotum pro magnifico","r":"Всё неизвестное кажется величественным","p":"о́мнэ игно́тум про магни́фико","a":"Тацит, «Агрикола»","n":"Всё далёкое и незнакомое кажется больше и страшнее.","g":"unknown"},{"la":"Tempus fugit","r":"Время бежит","p":"тэ́мпус фу́гит","a":"Восходит к Вергилию, «Георгики»: «Но бежит между тем невозвратное время»","n":"Надпись на многих старинных часах.","g":"time"},{"la":"Cui prodest?","r":"Кому выгодно?","p":"ку́и про́дэст","a":"Сенека, «Медея»: «Cui prodest scelus, is fecit» («Сделал тот, кому выгодно преступление»); ср. вопрос «Cui bono?» римского судьи Луция Кассия (по Цицерону)","n":"Первый вопрос следователя: кому выгодно случившееся?","g":"question"},{"la":"Natura non facit saltus","r":"Природа не делает скачков","p":"нату́ра нон фа́цит са́льтус","a":"Лейбниц, Линней","n":"В природе всё развивается постепенно.","g":"logic"},{"la":"Nil admirari","r":"Ничему не удивляться","p":"ниль адмира́ри","a":"Гораций, «Послания»","n":"Невозмутимость как правило мудрого человека.","g":"patience"},{"la":"Rara avis","r":"Редкая птица","p":"ра́ра а́вис","a":"Ювенал, «Сатиры», VI","n":"У Ювенала: «Редкая птица на земле, похожая на чёрного лебедя». Тогда чёрных лебедей считали несуществующими — их увидели лишь в Австралии в XVII веке.","g":"unknown"},{"la":"Hic et nunc","r":"Здесь и сейчас","p":"хик эт нунк","a":"Латинское выражение","n":"Немедленно, не откладывая.","g":"time"},{"la":"Lex retro non agit","r":"Закон обратной силы не имеет","p":"лекс рэ́тро нон а́гит","a":"Принцип права","n":"Новый закон не наказывает за то, что было разрешено раньше.","g":"law"},{"la":"Sola dosis facit venenum","r":"Только доза делает вещество ядом","p":"со́ля до́зис фа́цит вэнэ́нум","a":"Латинская формула мысли Парацельса (XVI в.)","n":"Парацельс писал: «Всё — яд, и ничто не лишено ядовитости; одна лишь доза делает яд незаметным». Основа фармакологии.","g":"medicine"},{"la":"Similia similibus curantur","r":"Подобное излечивается подобным","p":"сими́лиа сими́либус кура́нтур","a":"Принцип гомеопатии С. Ганемана (1796–1810); у Ганемана — «Similia similibus curentur» («Пусть подобное лечится подобным»)","n":"Противоположный принцип — «Contraria contrariis curantur» — восходит к Гиппократу. Научных доказательств действенности гомеопатии нет.","g":"medicine"},{"la":"Ubi pus, ibi evacua","r":"Где гной, там вскрой","p":"у́би пус, и́би эва́куа","a":"Старинное правило хирургии","n":"Одна из первых латинских фраз, которые слышит студент-медик.","g":"medicine"},{"la":"Ignoti nulla cupido","r":"К неизвестному нет влечения","p":"игно́ти ну́лля купи́до","a":"Овидий, «Наука любви»","n":"Нельзя желать того, о чём не знаешь.","g":"unknown"}],"words":[{"w":"вокзал","q":["Откуда пришло слово «вокзал»?","От названия увеселительного сада в Лондоне","От немецкого «Wagen» — повозка","От французского «voie» — путь"],"o":"Воксхолл (Vauxhall) — знаменитый увеселительный сад в Лондоне. В 1838 году в Павловске у конечной станции Царскосельской железной дороги открыли «воксал» — концертный зал, куда публика приезжала по железной дороге. Название перешло на само здание станции."},{"w":"спасибо","q":["Из чего сложилось слово «спасибо»?","Из пожелания «спаси Бог»","Из «спасение» и «благо»","Из старого слова «спас» — праздник"],"o":"«Спасибо» — сросшееся пожелание «спаси Бог». Конечный звук «г» со временем выпал."},{"w":"здравствуйте","q":["Что мы, по сути, желаем, говоря «здравствуйте»?","Здоровья","Доброго утра","Удачной дороги"],"o":"«Здравствуйте» — форма глагола «здравствовать», то есть «быть здоровым». Здороваясь, мы желаем человеку здоровья."},{"w":"врач","q":["С каким словом родственно слово «врач»?","«Врать» — в старом значении «говорить»","«Ворота»","«Вращать»"],"o":"Древнее «врати» значило «говорить», а не «лгать». Врач — тот, кто «заговаривает» болезнь: первые врачеватели лечили заговорами и наговорами."},{"w":"лекарь","q":["Что значило древнее слово «лек»?","Лекарство","Постель","Боль"],"o":"Древнерусское «лѣкъ» значило «лекарство», отсюда «лекарь» и «лекарство». Слово очень древнее, его связывают с германским корнем со значением «лечить»."},{"w":"аптека","q":["Что значило греческое слово, от которого произошла «аптека»?","Склад, хранилище","Целебная трава","Врачебный кабинет"],"o":"Греческое «апотеке» значило «склад, хранилище». Через латинское apotheca и польское apteka слово пришло в русский язык в XVI веке. Первая аптека в Москве, Государева, открылась в Кремле в 1581 году."},{"w":"госпиталь","q":["С каким латинским словом связан «госпиталь»?","«Гость» (hospes)","«Боль» (dolor)","«Дом» (domus)"],"o":"Латинское hospes значит «гость», hospitalis — «гостеприимный». В Средние века госпиталями называли приюты для странников и больных при монастырях. Родственные слова — «отель» и «хоспис»."},{"w":"пациент","q":["Что значит латинское patiens, от которого произошёл «пациент»?","Терпящий, страдающий","Спящий","Ожидающий"],"o":"Пациент — «терпящий». От того же корня английское и французское patience — «терпение»."},{"w":"клиника","q":["Что значит греческое klinē?","Ложе, кровать","Лекарство","Белый халат"],"o":"Клиника — от греческого klinē, «ложе». Врач лечил больного у его постели — отсюда и «клинический», то есть наблюдаемый у постели больного."},{"w":"хирург","q":["Из каких греческих слов составлено слово «хирург»?","«Рука» и «работа»","«Нож» и «кровь»","«Тело» и «помощь»"],"o":"Хирург — по-гречески «рукодел»: cheir — рука, ergon — дело, работа. В Средние века хирургией нередко занимались цирюльники: они пускали кровь и вправляли кости."},{"w":"терапевт","q":["Что значило греческое therapeuō?","Служить, ухаживать","Резать","Наблюдать звёзды"],"o":"Терапевт — от греческого therapeuō, «служить, ухаживать за кем-то». Лечение — это прежде всего забота."},{"w":"диагноз","q":["Что значит греческое diagnōsis?","Распознавание","Приговор","Обещание"],"o":"Диагноз — «распознавание». Врач распознаёт болезнь по признакам — симптомам (греческое symptōma — «совпадение, случай»)."},{"w":"рецепт","q":["С какого латинского слова начинались старые рецепты?","Recipe — «возьми»","Repete — «повтори»","Recte — «правильно»"],"o":"Старинный рецепт начинался словом Recipe — «возьми». Само слово «рецепт» — от латинского receptum, «взятое». Сокращение Rp. до сих пор пишут на рецептурных бланках."},{"w":"карантин","q":["При чём здесь число?","По-итальянски quaranta — «сорок»: прибывших выдерживали сорок дней","Карантин длился четверть года — «кварта»","Так звали венецианского врача"],"o":"В 1377 году город Рагуза (Дубровник), спасаясь от чумы, стал выдерживать прибывших 30 дней, а в XV веке Венеция продлила срок до сорока дней — quaranta giorni. Отсюда итальянское quarantena — «сорокадневье» — и наш карантин."},{"w":"вакцина","q":["При чём здесь корова?","Латинское vacca — корова: первую прививку делали коровьей оспой","Первую вакцину делали из коровьего молока","Так звали корову учёного Пастера"],"o":"В 1796 году английский врач Эдвард Дженнер привил мальчику коровью оспу, и тот стал невосприимчив к натуральной оспе. Латинское vacca — корова, vaccinus — коровий. В 1881 году Луи Пастер предложил в честь Дженнера называть вакцинами все прививочные препараты."},{"w":"грипп","q":["Что значит французское gripper?","Схватить","Простудиться","Чихать"],"o":"Французское gripper — «схватить, вцепиться». Болезнь «хватает» человека внезапно."},{"w":"инфлюэнца","q":["Чьё «влияние» имели в виду итальянцы?","Звёзд","Городских властей","Плохой воды"],"o":"Итальянское influenza — «влияние». В Средние века эпидемии объясняли влиянием звёзд и планет: говорили influenza di stelle — «влияние звёзд»."},{"w":"малярия","q":["Что значит итальянское mala aria?","Дурной воздух","Болотная лихорадка","Злая муха"],"o":"Mala aria — «дурной воздух». Болезнь связывали с испарениями болот; о том, что её переносят комары, узнали только в конце XIX века."},{"w":"ангина","q":["Что значит латинское angere?","Сжимать, душить","Гореть","Болеть горлом"],"o":"Латинское angere — «сжимать, душить», отсюда angina — «удушье». Стенокардию по-латыни называют angina pectoris, буквально «удушье груди»; в старину её звали «грудной жабой»."},{"w":"кризис","q":["Что значило греческое krisis?","Решение, перелом","Беда, несчастье","Высокая температура"],"o":"Греческое krisis — «решение, поворотный пункт». Врачи Древней Греции называли кризисом перелом болезни, когда решается, выздоровеет больной или нет."},{"w":"панацея","q":["Кто такая Панакея?","Греческая богиня, «всеисцеляющая»","Египетская царица-знахарка","Римская целебная трава"],"o":"Панакея — дочь бога врачевания Асклепия, её имя значит «всеисцеляющая». Отсюда «панацея» — средство от всех бед, которого, увы, не существует."},{"w":"гигиена","q":["С каким греческим словом связана «гигиена»?","Hygieia — «здоровье»","Hygros — «влажный»","Hydōr — «вода»"],"o":"Греческое hygieinos — «здоровый, целебный», от hygieia — «здоровье». Так же звали и богиню здоровья Гигиею, дочь Асклепия. Её символ — змея, пьющая из чаши; он и сегодня — эмблема медицины и аптек."},{"w":"микстура","q":["Что значит латинское mixtura?","Смесь","Горькое питьё","Капля"],"o":"Mixtura — «смесь». Микстура — жидкое лекарство, смешанное из нескольких веществ."},{"w":"пилюля","q":["Что значит латинское pilula?","Шарик","Горечь","Таблетка"],"o":"Pilula — уменьшительное от pila, «мяч»: «шарик». Пилюли катали вручную на особой дощечке."},{"w":"таблетка","q":["Что значит французское tablette?","Дощечка, плитка","Порция","Лекарство от головы"],"o":"Tablette — «дощечка, плитка»; от того же корня — «таблица» и «табличка»."},{"w":"бинт","q":["Из какого языка пришло слово «бинт»?","Из немецкого: binden — связывать","Из латинского: bis — дважды","Из французского: bande — полоса"],"o":"Немецкое Binde — «повязка», от binden — «связывать». Того же корня английское bind."},{"w":"шприц","q":["Что значит немецкое spritzen?","Брызгать","Колоть","Лечить"],"o":"Немецкое Spritze — от spritzen, «брызгать». Сначала так назывался любой ручной насос-брызгалка, даже пожарный."},{"w":"вирус","q":["Что значит латинское virus?","Яд","Микроб","Заразный"],"o":"Латинское virus — «яд». Название дали в конце XIX века, когда обнаружили возбудителя, проходящего через фильтры, задерживающие бактерии."},{"w":"бацилла","q":["Что значит латинское bacillum?","Палочка","Зёрнышко","Червячок"],"o":"Bacillum — «палочка». Многие бактерии под микроскопом действительно похожи на палочки. «Бактерия» по-гречески тоже значит «палочка»."},{"w":"мышца","q":["С каким словом родственна «мышца»?","«Мышь»","«Мысль»","«Мыть»"],"o":"«Мышца» — от слова «мышь»: сокращающаяся под кожей мышца напоминала бегущую мышку. Так же думали и римляне: латинское musculus значит «мышонок»."},{"w":"зрачок","q":["С каким словом связан «зрачок»?","«Зреть» — смотреть","«Зрелый»","«Зерно»"],"o":"«Зрачок» — от старого «зрак», «взгляд, вид», и глагола «зреть» — «смотреть» (ср. «зрение», «зритель»)."},{"w":"ладонь","q":["Как раньше звучало слово «ладонь»?","«Долонь»","«Лодонь»","«Ладня»"],"o":"Древнерусское «долонь» — «нижняя сторона руки» (ср. «дол» — низ). Звуки поменялись местами, и получилась «ладонь»."},{"w":"июль и август","q":["В честь кого названы июль и август?","Юлия Цезаря и императора Августа","Римских богов Юпитера и Августы","Двух греческих звёзд"],"o":"Месяц Quintilis («пятый») переименовали в честь Юлия Цезаря, реформатора календаря. Следующий за ним Sextilis («шестой») — в честь первого императора, Октавиана Августа."},{"w":"сентябрь — декабрь","q":["Почему декабрь — «десятый», если он двенадцатый?","Древний римский год начинался с марта","Римляне считали месяцы от Рождества","Это ошибка переписчика"],"o":"September, October, November, December по-латыни — «седьмой», «восьмой», «девятый», «десятый». В древнейшем римском календаре год начинался с марта, и счёт сохранился в названиях."},{"w":"неделя","q":["Что значило слово «неделя» в древнерусском языке?","Воскресенье — день, когда «не делают»","Семь дней","Работа без отдыха"],"o":"«Неделей» сначала называли день отдыха — «не делать». Отсюда «понедельник» — день «по неделе», после воскресенья. Позже «неделей» стали называть всю семидневку."},{"w":"суббота","q":["Какое слово лежит в основе «субботы»?","Древнееврейское «шаббат» — покой","Латинское sub — под","Греческое hex — шесть"],"o":"Древнееврейское «шаббат» — «покой, отдых», седьмой день недели. Через греческий слово вошло во многие языки."},{"w":"календарь","q":["Что римляне называли «календами»?","Первый день месяца","Праздник урожая","Солнечные часы"],"o":"Календы — первое число месяца у римлян; в этот день платили проценты по долгам, а долги записывали в долговую книгу — calendarium. Отсюда и «календарь»."},{"w":"каникулы","q":["При чём здесь собака?","Canicula — «собачка», так римляне звали звезду Сириус","Летом собак выпускали на волю","Так звали собаку римского учителя"],"o":"Латинское canicula — «собачка» — римское имя Сириуса, самой яркой звезды неба (она в созвездии Большого Пса). В самую жаркую пору лета Сириус появляется на утреннем небе перед восходом солнца; эти дни римляне называли «собачьими» — dies caniculares. Отсюда и наши каникулы — летний перерыв в занятиях."},{"w":"студент","q":["Что значит латинское studere?","Усердно заниматься","Слушать лекции","Жить в общежитии"],"o":"Латинское studere — «усердно заниматься, стремиться». От того же корня «студия» и «штудировать»."},{"w":"экзамен","q":["Что значило латинское examen?","Стрелка весов, взвешивание","Список вопросов","Наказание"],"o":"Examen — «стрелка весов», «взвешивание». Экзамен — это «взвешивание» знаний."},{"w":"шпаргалка","q":["Что значит польское szpargał?","Старая ненужная бумага","Хитрость","Маленькая записка"],"o":"Польское szpargały — «старые бумаги, бумажный хлам». В русском школьном языке шпаргалка стала тайной подсказкой на экзамене."},{"w":"ерунда","q":["Какую версию происхождения «ерунды» приводят словари?","Из семинарского произношения латинского gerundium","От «ер» — названия буквы Ъ","От немецкого Herr — господин"],"o":"По распространённой версии, это семинаристская переделка латинского gerundium — трудной для понимания грамматической формы. Версия не единственная: этимологи считают вопрос открытым."},{"w":"алфавит","q":["Из чего сложилось слово «алфавит»?","Из названий двух первых греческих букв","Из арабского «аль» и «фавит» — книга","Из латинского «первый ряд»"],"o":"Альфа + бета (в средневековом греческом произношении — «вита»): первые буквы греческого алфавита. «Азбука» устроена так же: аз + буки."},{"w":"тетрадь","q":["Какое число «спрятано» в слове «тетрадь»?","Четыре","Два","Сто"],"o":"Греческое tetradion — «четвёрка»: лист, сложенный вчетверо. Тетрадь получалась из одного большого листа, сложенного и сшитого."},{"w":"карандаш","q":["Что значит тюркское «кара таш»?","Чёрный камень","Острый грифель","Деревянная палочка"],"o":"«Кара» — чёрный, «таш» — камень. Первые карандаши были из графита — «чёрного камня»."},{"w":"зонтик","q":["От чего защищал зонтик, судя по его названию?","От солнца","От дождя","От ветра"],"o":"Голландское zondek — «покрышка от солнца» (zon — солнце). Сначала было «зондек», потом «зонтик», а уже от него — «зонт»."},{"w":"галстук","q":["Что значит немецкое Halstuch?","Шейный платок","Узел","Мужское украшение"],"o":"Немецкое Halstuch — «шейный платок»: Hals — шея, Tuch — платок."},{"w":"рюкзак","q":["Что значит немецкое Rucksack буквально?","Спинной мешок","Ручной мешок","Мешок для ружья"],"o":"Rucksack — «спинной мешок»: Ruck (в альпийских говорах — то же, что Rücken) — «спина», Sack — «мешок»."},{"w":"бутерброд","q":["Что значит немецкое Butterbrot?","Хлеб с маслом","Хлеб с колбасой","Утренний хлеб"],"o":"Butter — масло, Brot — хлеб. В немецком это именно хлеб с маслом; в русском — любой ломоть хлеба с чем-нибудь сверху."},{"w":"вермишель","q":["Что значит итальянское vermicelli?","Червячки","Ниточки","Солнечные лучи"],"o":"Vermicelli — «червячки»: тонкие длинные нити теста и правда похожи на маленьких червяков."},{"w":"помидор","q":["Что значит итальянское pomo d’oro?","Золотое яблоко","Красная ягода","Солнечный плод"],"o":"Pomo d’oro — «золотое яблоко»: по-видимому, первые томаты, привезённые в Европу, были жёлтыми. Слово «томат» — из языка ацтеков."},{"w":"апельсин","q":["Что значит голландское appelsien?","Китайское яблоко","Солнечное яблоко","Сладкое яблоко"],"o":"Appel — яблоко, Sien — Китай. Апельсины привезли в Европу из Китая португальские мореплаватели."},{"w":"картофель","q":["Какой гриб «спрятан» в слове «картофель»?","Трюфель","Шампиньон","Опёнок"],"o":"Немецкое Kartoffel восходит к итальянскому tartufolo — «трюфель»: клубни картошки напомнили итальянцам подземные грибы-трюфели."},{"w":"огурец","q":["Что значило греческое слово, от которого произошёл «огурец»?","Незрелый","Зелёный","Колючий"],"o":"Слово восходит к греческому aōros — «незрелый»: огурцы едят незрелыми, в отличие от дынь."},{"w":"арбуз","q":["Что, по обычному толкованию, буквально значит персидское «харбуза»?","Ослиный огурец","Сладкий плод","Полосатый шар"],"o":"Через тюркские языки пришло персидское «харбуза» — «дыня»; его обычно толкуют как «ослиный (то есть огромный) огурец»."},{"w":"изюм","q":["Что значит тюркское «юзюм»?","Виноград","Сушёный плод","Сладость"],"o":"В тюркских языках «юзюм» — просто «виноград». В русском так стали называть сушёный виноград."},{"w":"свёкла","q":["Из какого языка пришло слово «свёкла»?","Из греческого","Из немецкого","Из татарского"],"o":"Средневековое греческое seuklon (во множественном числе seukla, произносилось «сэфкла»; древняя форма — seutlon) пришло к нам вместе с самим растением."},{"w":"чай","q":["Из какого языка пришло слово «чай»?","Из китайского","Из индийского","Из английского"],"o":"Из северокитайского «ча». А в Англию и Голландию чай везли из южных портов, где говорили «тэ», — отсюда английское tea."},{"w":"кофе","q":["Откуда родом слово «кофе»?","Из арабского","Из итальянского","Из испанского"],"o":"Арабское «кахва» через турецкое «кахве» и голландское koffie пришло в русский язык. Впервые слово записано в 1665 году, в рецепте для царя Алексея Михайловича, а в обиход кофе ввёл Пётр I. Слово мужского рода: вспомните старое «кофей»."},{"w":"шоколад","q":["Чей язык подарил нам слово «шоколад»?","Ацтеков (индейцев Мексики)","Испанских моряков","Швейцарцев"],"o":"Слово восходит к языку науатль, на котором говорили ацтеки. У них был горький напиток из какао-бобов; испанцы привезли его в Европу."},{"w":"сахар","q":["Что значило древнеиндийское «шаркара»?","Песок, гравий","Мёд","Сладкий тростник"],"o":"Санскритское «шаркара» — «песок, гравий»: сахар был кристаллическим, похожим на песок. Через персидский, греческий и латынь слово разошлось по Европе."},{"w":"хлеб","q":["Откуда пришло слово «хлеб»?","Очень давно заимствовано из германских языков","Из латинского","Из древнегреческого"],"o":"Большинство этимологов считают, что слово заимствовано очень давно — у готов (готское hlaifs, «хлеб»). Того же корня английское loaf — «буханка»."},{"w":"блин","q":["Как раньше звучало слово «блин»?","«Млин» — от «молоть»","«Блюдо»","«Блеск»"],"o":"Древнее «млин» — изделие из молотой муки (от «молоть»). Звук «м» сменился на «б»."},{"w":"калач","q":["С каким словом связан «калач»?","«Коло» — круг","«Калить» — обжигать","«Кал» — грязь"],"o":"Калач — от древнего «коло», «круг, колесо»: калачи пекли в форме кольца с ручкой."},{"w":"квас","q":["Что значило слово «квас» вначале?","Кислый, закисший","Хлебный","Холодный"],"o":"«Квас» — от корня «кис-»: «кислый», «закваска». Сначала квасом называли всё заквашенное."},{"w":"творог","q":["От какого слова происходит «творог»?","«Творить» — придавать форму","«Твёрдый»","«Тварь»"],"o":"«Творог» связан с глаголом «творить» — в старом значении «придавать форму, сгущать»: молоко «творится», сгущается."},{"w":"винегрет","q":["Что значит французское vinaigre?","Уксус","Вино","Огород"],"o":"Французское vinaigrette — соус на уксусе (vinaigre — «кислое вино»). Сам салат из варёной свёклы — русское изобретение."},{"w":"котлета","q":["Что значит французское côtelette?","Рёбрышко","Кусок мяса","Жареное"],"o":"Côte — «ребро», côtelette — «рёбрышко»: настоящая котлета — кусок мяса на косточке. Рубленые котлеты — более позднее изобретение."},{"w":"тарелка","q":["Что значило итальянское tagliere?","Доска для резки","Глубокая миска","Поднос"],"o":"Через немецкое Teller и польское talerz восходит к итальянскому tagliere — «доска, на которой режут мясо». Первые тарелки и были деревянными досками."},{"w":"вилка","q":["С каким словом родственна «вилка»?","«Вилы»","«Велеть»","«Великий»"],"o":"Вилка — «маленькие вилы»: так её назвали за зубцы."},{"w":"кастрюля","q":["Из какого языка пришло слово «кастрюля»?","Из голландского","Из итальянского","Из греческого"],"o":"Голландское kastrol — «котелок». Слово пришло при Петре I."},{"w":"мебель","q":["Что значит латинское mobilis, от которого произошла «мебель»?","Подвижный","Деревянный","Красивый"],"o":"Французское meuble — «движимое имущество», от латинского mobilis — «подвижный». Мебель — то, что можно передвинуть, в отличие от дома."},{"w":"диван","q":["Что значило слово «диван» на Востоке?","Государственный совет","Ковёр","Подушка"],"o":"Персидское «диван» — «собрание, совет». В Турции так назывался государственный совет, члены которого сидели на мягких низких скамьях вдоль стен. Название перешло на мебель."},{"w":"сундук","q":["Откуда пришло слово «сундук»?","Из тюркских языков (а туда — из арабского)","Из финского","Из немецкого"],"o":"Тюркское «сандук», восходящее к арабскому, — «ящик, ларь»."},{"w":"утюг","q":["Из какого языка пришло слово «утюг»?","Из тюркского","Из немецкого","Из итальянского"],"o":"Тюркское «ütü» — утюг. Первые утюги были чугунными, их грели на плите или наполняли углями."},{"w":"деньги","q":["Что значило тюркское «тенге»?","Серебряная монета","Золото","Кошелёк"],"o":"Тюркское «тенге» — серебряная монета. Так называется и нынешняя валюта Казахстана."},{"w":"рубль","q":["От какого глагола происходит «рубль»?","«Рубить»","«Рябить»","«Рыть»"],"o":"Рублём назывался кусок, отрубленный от серебряного слитка — гривны."},{"w":"копейка","q":["Почему копейка так называется?","На ней был изображён всадник с копьём","Её «копили»","Она была «копией» серебряной монеты"],"o":"После денежной реформы 1535 года на серебряной монете, равной сотой части рубля, чеканили всадника с копьём. Монету назвали «копейной деньгой», а потом — копейкой."},{"w":"магазин","q":["Что значило арабское «махазин»?","Склады","Покупки","Рынок"],"o":"Арабское «махазин» — «склады». Через итальянский и французский слово пришло в русский язык. Магазин у автомата — тоже «хранилище» патронов."},{"w":"базар","q":["Из какого языка пришло слово «базар»?","Из персидского","Из греческого","Из турецкого «бас» — голова"],"o":"Персидское «базар» — «рынок». Отсюда и «базарить» — шумно спорить."},{"w":"товарищ","q":["Кем был «товарищ» изначально?","Компаньоном по торговле, совладельцем товара","Соседом по дому","Однополчанином"],"o":"По наиболее принятой версии, слово тюркского происхождения: «товар» (имущество, скот) + «иш» (друг, спутник). Товарищ — тот, с кем вместе ведёшь торговлю."},{"w":"богатырь","q":["Откуда пришло слово «богатырь»?","Из тюркских и монгольских языков","От «бог» и «тырить»","Из древнегреческого"],"o":"Монгольское «багатур» — «храбрец, герой». Слово стало русским и прижилось в былинах."},{"w":"сарафан","q":["Что значило персидское «сарапа»?","Почётная одежда (с головы до ног)","Женское платье","Длинная рубаха"],"o":"Персидское «сарапа» — «с головы до ног», почётная одежда, которую дарил правитель. В России сарафан сначала носили и мужчины."},{"w":"башмак","q":["Из какого языка пришло слово «башмак»?","Из тюркского","Из немецкого","Из польского"],"o":"Тюркское «башмак» — «обувь»."},{"w":"богатый","q":["Что значило слово «бог» в древности?","Доля, достаток","Дождь","Сила"],"o":"В древнем значении «бог» — «доля, счастье, достаток». Богатый — «имеющий долю», а убогий — «лишённый доли», бедный."},{"w":"счастье","q":["Из чего сложилось слово «счастье»?","«С» + «часть» — хорошая доля","«Час» — мгновение","«Чистый»"],"o":"Древнее «съчастье» — «хорошая часть, доля»: счастливый — тот, кому досталась хорошая часть."},{"w":"стол","q":["С каким глаголом связан «стол»?","«Стлать» — расстилать","«Стоять»","«Столбить»"],"o":"«Стол» — от «стлать»: настил, подстилка. В старину «стол» означал также «престол», место правителя: «стольный град»."},{"w":"окно","q":["С каким словом родственно «окно»?","«Око»","«Около»","«Окунуть»"],"o":"Окно — от «око», «глаз»: окно — «глаз» дома."},{"w":"сутки","q":["Что значило «сутки» вначале?","Стык дня и ночи","Двадцать четыре часа","Ночёвка"],"o":"«Сутки» — от «сутъкнути», «столкнуться»: место, где сходятся день и ночь. Потом так стали называть весь день вместе с ночью."},{"w":"спутник","q":["Почему слово «спутник» знает весь мир?","Так назвали первый искусственный спутник Земли (1957)","Это старинное английское слово","Так звали русского астронома"],"o":"Спутник — «тот, кто идёт по одному пути»: с-путь. После запуска первого искусственного спутника Земли 4 октября 1957 года слово sputnik вошло во многие языки мира."},{"w":"трамвай","q":["Из чего сложилось английское tramway?","«Вагонетка» + «путь»","«Трамбовать» + «вагон»","Фамилия изобретателя Трамвэя"],"o":"Английское tram — «рельс, вагонетка», way — «путь». Сначала так назывался путь для рудничных вагонеток."},{"w":"такси","q":["С каким словом связано «такси»?","«Таксометр» — счётчик платы","«Такса» — порода собак","«Тактика»"],"o":"Французское taxi — сокращение от taximètre, «таксометр»: так называется прибор, считающий плату по тарифу (такса — расценка). В России сначала говорили «таксомотор»."},{"w":"метро","q":["Что значит французское métropolitain?","Столичный","Подземный","Быстрый"],"o":"Французское chemin de fer métropolitain — «столичная железная дорога». Слово «метрополитен» сократилось до «метро»."},{"w":"ура","q":["Что говорят словари о происхождении «ура»?","Точно неизвестно: есть тюркская и немецкая версии","Это сокращение «урожай»","Это английское hurray"],"o":"Одни этимологи возводят «ура» к тюркскому «ур» — «бей!», другие — к немецкому hurra. Вопрос остаётся открытым."},{"w":"лошадь","q":["Откуда пришло слово «лошадь»?","Из тюркских языков","Из латыни","Из древнегреческого"],"o":"Тюркское «алаша» — «мерин, лошадь». Исконно русское слово — «конь»."},{"w":"медведь","q":["Что буквально значит слово «медведь»?","«Медоед» — поедающий мёд","«Медленный зверь»","«Бурый»"],"o":"«Медведь» буквально — «медоед»: «мёд» + древнее «ѣдь» (от «есть», ср. «еда»). Толкование «ведающий мёд» — народное. Это иносказание: настоящее имя зверя наши предки, по-видимому, боялись произносить."},{"w":"компьютер","q":["Что значит латинское computare?","Считать","Думать","Запоминать"],"o":"Латинское computare — «считать». Первые компьютеры и были вычислительными машинами."},{"w":"робот","q":["Кто придумал слово «робот»?","Чешский художник Йозеф Чапек для пьесы брата Карела","Американский инженер","Русский писатель-фантаст"],"o":"Слово появилось в пьесе Карела Чапека «R.U.R.» (1920), а придумал его брат писателя, Йозеф. Чешское robota — «подневольный труд, барщина»."},{"w":"газ","q":["Кто придумал слово «газ»?","Фламандский учёный ван Гельмонт","Французский химик Лавуазье","Римский врач Гален"],"o":"В XVII веке Ян Баптиста ван Гельмонт придумал слово «газ», переделав греческое «хаос»."},{"w":"пижама","q":["Откуда пришло слово «пижама»?","Из языков Индии и Персии: «одежда для ног»","Из французского: «ночная»","Из английского: «пижон»"],"o":"«Пай-джама» — «одежда для ног», свободные штаны в Индии. Через английский слово попало в Европу."},{"w":"бойкот","q":["Кто такой Бойкот?","Управляющий имением в Ирландии","Английский король","Американский профсоюзный лидер"],"o":"В 1880 году в Ирландии арендаторы отказались иметь какие-либо дела с управляющим поместьем — английским капитаном Чарльзом Бойкотом, и его фамилия стала нарицательной."},{"w":"силуэт","q":["Кто такой Силуэт?","Французский министр финансов","Художник, рисовавший тени","Итальянский фотограф"],"o":"Этьен де Силуэт, генеральный контролёр финансов Франции (1759), прославился строгой экономией. Дешёвые контурные портреты стали в насмешку называть «портретами а-ля Силуэт»."},{"w":"меценат","q":["Кто такой Меценат?","Римлянин, покровитель поэтов","Греческий философ","Итальянский банкир"],"o":"Гай Цильний Меценат — друг императора Августа, покровитель поэтов Вергилия и Горация. Его имя стало обозначать покровителя искусств."},{"w":"ментор","q":["Кто такой Ментор?","Друг Одиссея и воспитатель его сына","Учитель Александра Македонского","Римский оратор"],"o":"В «Одиссее» Гомера Ментор — друг Одиссея, которому тот поручил воспитание сына Телемаха. Ментор — наставник."},{"w":"паника","q":["При чём здесь бог Пан?","Пан внезапно наводил на людей безотчётный страх","Пан играл на свирели так громко, что люди пугались","Пан был богом войны"],"o":"Греческий бог лесов и стад Пан, по поверьям, внезапно наводил на путников безотчётный «панический» страх."},{"w":"эхо","q":["Кто такая Эхо?","Нимфа, которая могла только повторять чужие слова","Богиня гор","Греческая певица"],"o":"По мифу, нимфа Эхо была наказана богиней Герой: она могла лишь повторять окончания чужих слов."},{"w":"музей","q":["Что значило греческое mouseion?","Храм муз","Собрание редкостей","Библиотека"],"o":"Мусейон — «храм муз», покровительниц искусств и наук. Так назывался знаменитый учёный центр в Александрии."},{"w":"пароход","q":["Когда появилось слово «пароход»?","В 1810-х годах, вместе с первыми пароходами в России","В XVII веке","В 1950-х"],"o":"Первые пароходы появились в России в 1815 году, и вскоре морской офицер П. И. Рикорд впервые употребил в печати слово «пароход». Соперников — «пироскаф» и «стимбот» — оно окончательно вытеснило лишь к середине XIX века."},{"w":"хулиган","q":["Какую версию происхождения «хулигана» приводят чаще всего?","От фамилии буйного ирландского семейства в Лондоне","От «хула» и «ган»","От названия английского паба"],"o":"Чаще всего слово возводят к ирландской фамилии Хулихэн (Houlihan): члены этого семейства в Лондоне конца XIX века прославились буйным нравом. Это лишь версия. В английских газетах слово появилось в 1898 году, в том же году попало в русскую печать, а широко распространилось в начале XX века."},{"w":"кафтан","q":["Из какого языка пришло слово «кафтан»?","Из персидского (через тюркские)","Из греческого","Из немецкого"],"o":"Персидское «хафтан» — верхняя одежда. Пришло через турецкий."},{"w":"собака","q":["Откуда, по мнению многих этимологов, пришло слово «собака»?","Из иранских языков","Из латыни","Из греческого"],"o":"Многие этимологи считают слово заимствованным из иранских языков. Исконно русское название — «пёс»."},{"w":"огород","q":["Что значило «огород» вначале?","Огороженное место","Грядки","Сад за домом"],"o":"«Огород» — от «огородить»: место, обнесённое изгородью. Того же корня «город» — изначально «огороженное поселение, крепость»."}],"stress":[{"r":"звонИт","w":"звОнит","n":"В личных формах ударение на окончании: звонИшь, звонИм, звонЯт."},{"r":"позвонИт","w":"позвОнит","n":"Как «звонИт»."},{"r":"перезвонИт","w":"перезвОнит","n":"Как «звонИт»."},{"r":"дозвонИтся","w":"дозвОнится","n":"Как «звонИт»."},{"r":"включИт","w":"вклЮчит","n":"Так же: включИшь, включИм, включАт."},{"r":"вручИт","w":"врУчит","n":"Так же: вручИшь, вручАт."},{"r":"облегчИть","w":"облЕгчить","n":"Так же: облегчИт, облегчИшь."},{"r":"углубИть","w":"углУбить","n":"Так же: углубИт."},{"r":"укрепИт","w":"укрЕпит","n":"Так же: укрепИшь."},{"r":"сверлИт","w":"свЕрлит","n":"Так же: сверлИшь, сверлЯт."},{"r":"кровоточИт","w":"кровотОчит","n":"Так же: кровоточАт."},{"r":"щемИт","w":"щЕмит","n":"Сердце щемИт."},{"r":"повторИт","w":"повтОрит","n":"Так же: повторИшь."},{"r":"одолжИт","w":"одОлжит","n":"Так же: одолжИшь."},{"r":"ободрИть","w":"обОдрить","n":"Так же: ободрИшь."},{"r":"чЕрпать","w":"черпАть","n":"Ударение на первом слоге: чЕрпаю, чЕрпает."},{"r":"бралА","w":"брАла","n":"Глаголы прошедшего времени женского рода часто «тянут» ударение на окончание: бралА, взялА, ждалА."},{"r":"взялА","w":"взЯла","n":"Как «бралА»."},{"r":"ждалА","w":"ждАла","n":"Как «бралА»."},{"r":"лилА","w":"лИла","n":"Так же: налилА, полилА."},{"r":"налилА","w":"налИла","n":"Как «лилА»."},{"r":"началА","w":"нАчала","n":"Но: нАчал, нАчали."},{"r":"нАчал","w":"начАл","n":"Мужской род и множественное число — ударение на первом слоге: нАчал, нАчали."},{"r":"нАчали","w":"начАли","n":"Как «нАчал»."},{ но серебром."]},{"a":"А. С. Пушкин","t":"Зимний вечер","y":"1825","l":["Буря мглою небо кроет,","Вихри снежные крутя;","То, как зверь, она завоет,","То заплачет, как дитя,","То по кровле обветшалой","Вдруг соломой зашумит,","То, как путник запоздалый,","К нам в окошко застучит."]},{"a":"А. А. Фет","t":"«Я пришёл к тебе с приветом…»","y":"1843","l":["Я пришёл к тебе с приветом,","Рассказать, что солнце встало,","Что оно горячим светом","По листам затрепетало;"]},{"a":"Ф. И. Тютчев","t":"«Умом Россию не понять…»","y":"1866","l":["Умом Россию не понять,","Аршином общим не измерить:","У ней особенная стать —","В Россию можно только верить."]},{"a":"И. А. Крылов","t":"Ворона и Лисица","y":"1807","l":["Уж сколько раз твердили миру,","Что лесть гнусна, вредна; но только всё не впрок,","И в сердце льстец всегда отыщет уголок."]},{"a":"М. Ю. Лермонтов","t":"Утёс","y":"1841","l":["Ночевала тучка золотая","На груди утёса-великана;","Утром в путь она умчалась рано,","По лазури весело играя;","Но остался влажный след в морщине","Старого утёса. Одиноко","Он стоит, задумался глубоко,","И тихонько плачет он в пустыне."]},{"a":"А. С. Пушкин","t":"«Я вас любил…»","y":"1829","l":["Я вас любил: любовь ещё, быть может,","В душе моей угасла не совсем;","Но пусть она вас больше не тревожит;","Я не хочу печалить вас ничем.","Я вас любил безмолвно, безнадежно,","То робостью, то ревностью томим;","Я вас любил так искренно, так нежно,","Как дай вам бог любимой быть другим."]},{"a":"Ф. И. Тютчев","t":"«Есть в осени первоначальной…»","y":"1857","l":["Есть в осени первоначальной","Короткая, но дивная пора —","Весь день стоит как бы хрустальный,","И лучезарны вечера…"]},{"a":"А. А. Фет","t":"«Чудная картина…»","y":"1842","l":["Чудная картина,","Как ты мне родна:","Белая равнина,","Полная луна.","Свет небес высоких,","И блестящий снег,","И саней далёких","Одинокий бег."]},{"a":"М. Ю. Лермонтов","t":"Парус","y":"1832","l":["Белеет парус одинокой","В тумане моря голубом!..","Что ищет он в стране далёкой?","Что кинул он в краю родном?.."]},{"a":"Н. А. Некрасов","t":"Крестьянские дети (отрывок)","y":"1861","l":["Однажды, в студёную зимнюю пору","Я из лесу вышел; был сильный мороз.","Гляжу, поднимается медленно в гору","Лошадка, везущая хворосту воз."]},{"a":"А. С. Пушкин","t":"Осень (отрывок)","y":"1833","l":["Унылая пора! очей очарованье!","Приятна мне твоя прощальная краса —","Люблю я пышное природы увяданье,","В багрец и в золото одетые леса,","В их сенях ветра шум и свежее дыханье,","И мглой волнистою покрыты небеса,","И редкий солнца луч, и первые морозы,","И отдалённые седой зимы угрозы."]},{"a":"Ф. И. Тютчев","t":"«Нам не дано предугадать…»","y":"1869","l":["Нам не дано предугадать,","Как слово наше отзовётся, —","И нам сочувствие даётся,","Как нам даётся благодать…"]},{"a":"С. А. Есенин","t":"«Отговорила роща золотая…»","y":"1924","l":["Отговорила роща золотая","Берёзовым, весёлым языком,","И журавли, печально пролетая,","Уж не жалеют больше ни о ком."]},{"a":"М. Ю. Лермонтов","t":"«Выхожу один я на дорогу…»","y":"1841","l":["Выхожу один я на дорогу;","Сквозь туман кремнистый путь блестит;","Ночь тиха. Пустыня внемлет богу,","И звезда с звездою говорит."]},{"a":"А. С. Пушкин","t":"Руслан и Людмила (вступление)","y":"1828","l":["У лукоморья дуб зелёный;","Златая цепь на дубе том:","И днём и ночью кот учёный","Всё ходит по цепи кругом;","Идёт направо — песнь заводит,","Налево — сказку говорит."]},{"a":"И. А. Бунин","t":"Слово","y":"1915","l":["Молчат гробницы, мумии и кости, —","Лишь слову жизнь дана:","Из древней тьмы, на мировом погосте,","Звучат лишь Письмена.","И нет у нас иного достоянья!","Умейте же беречь","Хоть в меру сил, в дни злобы и страданья,","Наш дар бессмертный — речь."]},{"a":"Ф. И. Тютчев","t":"Весенние воды","y":"1830","l":["Ещё в полях белеет снег,","А воды уж весной шумят —","Бегут и будят сонный брег,","Бегут и блещут и гласят…"]},{"a":"А. С. Пушкин","t":"Зимняя дорога","y":"1826","l":["Сквозь волнистые туманы","Пробирается луна,","На печальные поляны","Льёт печально свет она."]},{"a":"И. А. Крылов","t":"Лебедь, Щука и Рак","y":"1814","l":["Когда в товарищах согласья нет,","На лад их дело не пойдёт,","И выйдет из него не дело, только мука."]},{"a":"Н. А. Некрасов","t":"Мороз, Красный нос (отрывок)","y":"1863","l":["Есть женщины в русских селеньях","С спокойною важностью лиц,","С красивою силой в движеньях,","С походкой, со взглядом цариц, —","Их разве слепой не заметит,","А зрячий о них говорит:","«Пройдёт — словно солнце осветит!","Посмотрит — рублём подарит!»"]},{"a":"А. С. Пушкин","t":"Няне","y":"1826","l":["Подруга дней моих суровых,","Голубка дряхлая моя!","Одна в глуши лесов сосновых","Давно, давно ты ждёшь меня."]},{"a":"С. А. Есенин","t":"Пороша","y":"1914","l":["Еду. Тихо. Слышны звоны","Под копытом на снегу,","Только серые вороны","Расшумелись на лугу."]},{"a":"М. Ю. Лермонтов","t":"«На севере диком стоит одиноко…»","y":"1841","l":["На севере диком стоит одиноко","На голой вершине сосна","И дремлет, качаясь, и снегом сыпучим","Одета, как ризой она."]},{"a":"Ф. И. Тютчев","t":"«Чародейкою Зимою…»","y":"1852","l":["Чародейкою Зимою","Околдован, лес стоит —","И под снежной бахромою,","Неподвижною, немою,","Чудной жизнью он блестит."]},{"a":"А. С. Пушкин","t":"Туча","y":"1835","l":["Последняя туча рассеянной бури!","Одна ты несёшься по ясной лазури,","Одна ты наводишь унылую тень,","Одна ты печалишь ликующий день."]},{"a":"А. А. Фет","t":"«Шёпот, робкое дыханье…»","y":"1850","l":["Шёпот, робкое дыханье,","Трели соловья,","Серебро и колыханье","Сонного ручья,"]},{"a":"М. Ю. Лермонтов","t":"Тучи","y":"1840","l":["Тучки небесные, вечные странники!","Степью лазурною, цепью жемчужною","Мчитесь вы, будто как я же, изгнанники","С милого севера в сторону южную."]},{"a":"С. А. Есенин","t":"«Не жалею, не зову, не плачу…»","y":"1921","l":["Не жалею, не зову, не плачу,","Всё пройдёт, как с белых яблонь дым.","Увяданья золотом охваченный,","Я не буду больше молодым."]}],"puzzles":[{"k":"загадка","q":"Б й выключатель к какой лампе?","a":"Включите первый выключатель и подождите несколько минут, потом выключите его и включите второй. Спуститесь: горящая лампа — от второго, тёплая погасшая — от первого, холодная — от третьего.","o":[],"e":""},{"k":"счёт","q":"В ведре 10 литров воды. Сколько стаканов по 250 мл можно наполнить?","a":"40","o":["40","25","10","400"],"e":""},{"k":"загадка","q":"Идут, идут, а с места не сойдут.","a":"Часы","o":["Часы","Поезд","Дождь","Река"],"e":""},{"k":"логика","q":"Какое число делится на все числа от 1 до 10 без остатка и при этом наименьшее?","a":"2520","o":["2520","3628800","1000","5040"],"e":""},{"k":"ряд","q":"Какая буква следующая: К, О, Ж, З, Г, С, …?","a":"Ф","o":["Ф","Р","Б","Т"],"e":"«Каждый охотник желает знать, где сидит фазан» — цвета радуги."},{"k":"слово","q":"Замените одну букву в слове КОЗА, чтобы получилось то, что покрывает тело человека.","a":"Кожа","o":["Кожа","Коса","Роза","Поза"],"e":"КОЗА → КОЖА: З заменили на Ж."},{"k":"загадка","q":"Кто говорит на всех языках?","a":"Эхо","o":["Эхо","Переводчик","Попугай","Сорока"],"e":""},{"k":"счёт","q":"Сколько концов у трёх с половиной палок?","a":"Восемь","o":["Восемь","Семь","Шесть","Девять"],"e":"Три целые палки и половинка — четыре куска, у каждого по два конца: 4 × 2 = 8."},{"k":"логика","q":"У отца Мэри пять дочерей: Чача, Чече, Чичи, Чочо. Как зовут пятую?","a":"Мэри","o":["Мэри","Чучу","Чуча","Чяча"],"e":""},{"k":"ряд","q":"Продолжите ряд: 2, 3, 5, 7, 11, 13, …","a":"17","o":["17","15","19","16"],"e":"Простые числа — делятся только на себя и на единицу."},{"k":"загадка","q":"Не море, не земля, корабли не плавают, а ходить нельзя.","a":"Болото","o":["Болото","Луг","Лёд","Пустыня"],"e":""},{"k":"счёт","q":"Сколько будет, если сложить все числа от 1 до 10?","a":"55","o":["55","50","45","100"],"e":"1+10, 2+9, 3+8, 4+7, 5+6 — пять пар по 11."},{"k":"логика","q":"В корзине пять яблок. Как разделить их между пятью девочками так, чтобы каждой досталось по яблоку и одно осталось в корзине?","a":"Последней отдать яблоко вместе с корзиной","o":["Последней отдать яблоко вместе с корзиной","Разрезать одно яблоко","Это невозможно","Одна девочка откажется"],"e":""},{"k":"загадка","q":"Летит — молчит, лежит — молчит, когда умрёт, тогда заревёт.","a":"Снег","o":["Снег","Лист","Камень","Перо"],"e":"Весной снег тает — и бегут шумные ручьи."},{"k":"ряд","q":"Продолжите ряд: 1, 3, 7, 15, 31, …","a":"63","o":["63","47","62","64"],"e":"Каждое число — удвоенное предыдущее плюс один."},{"k":"счёт","q":"Поезд длиной 1 км идёт со скоростью 1 км в минуту через туннель длиной 1 км. Сколько минут поезд будет хотя бы частично в туннеле?","a":"Две минуты","o":["Две минуты","Одну минуту","Три минуты","Полминуты"],"e":"Голова поезда проходит туннель за минуту, и ещё минута нужна, чтобы вышел хвост."},{"k":"загадка","q":"Сама не ест, а людей кормит.","a":"Ложка","o":["Ложка","Корова","Курица","Кошка"],"e":""},{"k":"логика","q":"Брат и сестра. Сестра говорит: «У меня братьев вдвое больше, чем сестёр». Брат говорит: «А у меня братьев и сестёр поровну». Сколько в семье детей?","a":"Семеро: четыре брата и три сестры","o":["Семеро: четыре брата и три сестры","Пятеро","Шестеро","Девятеро"],"e":"У брата: 3 брата и 3 сестры. У сестры: 4 брата и 2 сестры."},{"k":"слово","q":"Какой месяц самый короткий по названию?","a":"Май","o":["Май","Июнь","Март","Июль"],"e":""},{"k":"счёт","q":"Часы с боем бьют 6 раз за 5 секунд. Сколько времени нужно, чтобы пробить 12 раз?","a":"11 секунд","o":["11 секунд","10 секунд","12 секунд","13 секунд"],"e":"Между шестью ударами пять промежутков по секунде; между двенадцатью — одиннадцать."},{"k":"загадка","q":"Стоит дуб, в нём двенадцать гнёзд, в каждом гнезде по четыре яйца, в каждом яйце по семь цыплят.","a":"Год","o":["Год","Сад","Дерево","Часы"],"e":"12 месяцев, в каждом около четырёх недель, в каждой неделе семь дней."},{"k":"ряд","q":"Продолжите ряд: 81, 27, 9, 3, …","a":"1","o":["1","0","2","1,5"],"e":"Каждое число втрое меньше предыдущего."},{"k":"логика","q":"Как с помощью трёхлитровой и пятилитровой банок отмерить ровно 4 литра воды?","a":"Наполните пятилитровую банку и перелейте из неё в трёхлитровую — в пятилитровой останется 2 л. Вылейте трёхлитровую и перелейте в неё эти 2 л. Снова наполните пятилитровую и долейте трёхлитровую доверху (нужен 1 л) — в пятилитровой останется ровно 4 л.","o":[],"e":""},{"k":"загадка","q":"Что можно приготовить, но нельзя съесть?","a":"Уроки","o":["Уроки","Суп","Пирог","Кашу"],"e":""},{"k":"счёт","q":"Три курицы за три дня несут три яйца. Сколько яиц снесут двенадцать куриц за двенадцать дней?","a":"48","o":["48","12","36","144"],"e":"Одна курица несёт одно яйцо за три дня, то есть за 12 дней — четыре яйца. 12 × 4 = 48."},{"k":"загадка","q":"Кто ходит сидя?","a":"Шахматист","o":["Шахматист","Кучер","Пассажир","Младенец"],"e":""},{"k":"загадка","q":"Кланяется, кланяется, придёт домой — растянется.","a":"Топор","o":["Топор","Кот","Флюгер","Колодезный журавль"],"e":""},{"k":"загадка","q":"Под землёй птица гнездо свила, яиц нанесла.","a":"Картофель","o":["Картофель","Крот","Морковь","Репа"],"e":""},{"k":"логика","q":"Человек живёт на десятом этаже. Утром он спускается на лифте до первого этажа, а вечером доезжает только до седьмого и дальше идёт пешком. Почему?","a":"Он маленького роста и дотягивается только до кнопки седьмого этажа.","o":[],"e":""},{"k":"ряд","q":"Продолжите ряд: 2, 5, 10, 17, 26, …","a":"37","o":["37","35","34","36"],"e":"Квадраты чисел плюс один: 1+1, 4+1, 9+1, 16+1, 25+1, 36+1."},{"k":"счёт","q":"Сложите в уме: 1000 + 40 + 1000 + 30 + 1000 + 20 + 1000 + 10.","a":"4100","o":["4100","5000","4010","4000"],"e":"4 × 1000 = 4000 и 40 + 30 + 20 + 10 = 100, итого 4100. Многие отвечают «5000»: после 4090 хочется перескочить сразу на следующую тысячу."},{"k":"слово","q":"Какое слово читается одинаково слева направо и справа налево?","a":"Шалаш","o":["Шалаш","Домик","Лесок","Палатка"],"e":""}],"jokes":[{"k":"joke","t":"— Рабинович, почему вы всегда отвечаете вопросом на вопрос?\n— А как надо?"},{"k":"joke","t":"— Сёма, домой!\n— Мама, я что, замёрз?\n— Нет, ты проголодался!"},{"k":"joke","t":"Еврейская телеграмма: «Начинай волноваться. Подробности письмом»."},{"k":"joke","t":"Бедный еврей приходит к раввину:\n— Ребе, мы живём в одной комнате: я, жена, шестеро детей и тёща. Дышать нечем!\n— У тебя есть коза?\n— Есть.\n— Возьми её в дом.\nЧерез неделю:\n— Ребе, стало ещё хуже!\n— А теперь выведи козу.\nЕщё через неделю:\n— Ребе, спасибо! Какой простор, какой воздух!"},{"k":"joke","t":"Заказчик возмущается:\n— Бог создал весь мир за шесть дней, а вы шили мне брюки шесть недель!\nПортной:\n— Молодой человек, посмотрите на этот мир — и посмотрите на эти брюки!"},{"k":"joke","t":"К раввину приходит муж и жалуется на жену. Раввин выслушивает его и говорит:\n— Ты прав.\nПриходит жена и жалуется на мужа. Раввин выслушивает и её:\n— Ты права.\nЖена раввина:\n— Как же так? Не могут же они оба быть правы!\n— И ты тоже права."},{"k":"joke","t":"— Чем оптимист отличается от пессимиста?\n— Пессимист говорит: «Хуже уже быть не может!» А оптимист: «Может, может!»"},{"k":"joke","t":"Бабушка с внуком на пляже. Огромная волна уносит мальчика в море. Бабушка взывает к небу:\n— Господи, верни мне внука!\nСледующая волна выносит мальчика на берег, живого и здорового. Бабушка смотрит на него, потом на небо:\n— Так у него же была панамка!"},{"k":"joke","t":"Одесский трамвай.\n— Вы на следующей выходите?\n— Да.\n— А впереди вас выходят?\n— Да.\n— А вы их спрашивали?\n— Спрашивал.\n— И что они вам ответили?"},{"k":"joke","t":"— Ребе, можно ли курить во время молитвы?\n— Ни в коем случае!\n— А молиться во время курения?\n— Молиться можно всегда!"},{"k":"joke","t":"— Изя, почему ты не женишься?\n— Ищу идеальную женщину.\n— И что, ни разу не нашёл?\n— Один раз нашёл. Но она искала идеального мужчину."},{"k":"joke","t":"— Хаим, вы слышали? Рабинович выиграл в лотерею миллион!\n— Во-первых, не Рабинович, а Хаймович. Во-вторых, не в лотерею, а в преферанс. В-третьих, не миллион, а сто рублей. И в-четвёртых, не выиграл, а проиграл."},{"k":"joke","t":"— Доктор, я буду жить до восьмидесяти?\n— А сколько вам сейчас?\n— Восемьдесят.\n— Ну, что я вам говорил?"},{"k":"joke","t":"— Абрам, у тебя есть своё мнение?\n— Есть. Но я с ним не согласен."},{"k":"joke","t":"Хаим каждую субботу молится:\n— Господи, дай мне выиграть в лотерею!\nИ так много лет. Наконец с небес раздаётся голос:\n— Хаим, дай же и мне шанс — купи билет!"},{"k":"joke","t":"Еврейская мама кричит на берегу:\n— Помогите! Помогите! Мой сын-доктор тонет!"},{"k":"joke","t":"Мама подарила сыну на день рождения два галстука. Назавтра он надел один из них. Мама посмотрела:\n— А второй тебе, значит, не понравился?"},{"k":"joke","t":"— Сыночек, как ты?\n— Мама, у меня всё хорошо.\n— Что случилось?! Почему ты говоришь «хорошо» таким голосом?"},{"k":"joke","t":"— Доктор, у меня что-то с памятью.\n— И давно это у вас?\n— Что — давно?"},{"k":"joke","t":"— Моня, ты знаешь, что такое склероз?\n— Нет.\n— Так я же тебе вчера рассказывал!"},{"k":"joke","t":"— Абрам, как жизнь?\n— Как зебра: полоса белая, полоса чёрная.\n— А сейчас какая?\n— Сейчас, кажется, чёрная.\n— Ничего, потом будет белая!\n— Ну, может быть, это и была белая…"},{"k":"joke","t":"Хаим играет в шахматы с собакой. Сосед заглядывает:\n— Какая умная собака!\n— Умная? Я обыгрываю её три раза из пяти!"},{"k":"joke","t":"Рабинович заполняет анкету.\n«Были ли у вас колебания в проведении линии партии?»\nОн пишет: «Колебался вместе с линией»."},{"k":"joke","t":"Рабинович звонит в милицию:\n— У меня пропал попугай.\n— А мы-то здесь при чём?\n— Я просто хочу, чтобы вы знали: я с его мнением не согласен."},{"k":"joke","t":"Корреспондент спрашивает у пожилой пары, отмечающей золотую свадьбу:\n— В чём секрет вашего долгого брака?\n— Два раза в неделю мы ходим в ресторан: свечи, музыка, хорошее вино…\n— Как романтично!\n— Она ходит по вторникам, я — по пятницам."},{"k":"joke","t":"— Абрам, мы женаты сорок лет, а ты ни разу не сказал, что любишь меня!\n— Сара, я сказал тебе это сорок лет назад. Если что-то изменится — я сообщу."},{"k":"joke","t":"— Скажите, как вы дожили до ста лет?\n— Очень просто: я никогда ни с кем не спорил.\n— Не может быть, чтобы только поэтому!\n— Ну, значит, не только поэтому."},{"k":"joke","t":"— Доктор, у меня болит левое колено.\n— Голубчик, вам девяносто лет. Что вы хотите?\n— Доктор, правому колену тоже девяносто, а оно не болит!"},{"k":"joke","t":"— Хаим, вы хотели бы дожить до ста двадцати лет?\n— А почему так мало?"},{"k":"joke","t":"— Сара, где мои очки?\n— У тебя на носу.\n— Не морочь голову, я спрашиваю, где очки!"},{"k":"joke","t":"Пожилой еврей возвращается вечером домой:\n— Сара, у меня прекрасная новость! Сегодня я не потерял ни одной вещи!\n— Хаим, утром ты уходил в шляпе."},{"k":"joke","t":"Что такое свитер? Это то, что надевает ребёнок, когда его маме холодно."},{"k":"joke","t":"— Изя, ты почему такой задумчивый?\n— Думаю, правильно ли я сделал, что женился.\n— А почему вдруг задумался?\n— Жена велела подумать над своим поведением."},{"k":"joke","t":"— Абрам, за что ты меня любишь?\n— За всё.\n— А конкретно?\n— За всё. Конкретно."},{"k":"joke","t":"— Изя, почему ты не сделал уроки?\n— Свет погас.\n— А до этого?\n— А до этого я ждал, пока он погаснет."},{"k":"joke","t":"На одесском рынке:\n— Мадам, эта рыба свежая?\n— Свежая?! Да она ещё вчера плавала!\n— А сегодня?\n— А сегодня она отдыхает."},{"k":"joke","t":"— Ребе, как стать счастливым?\n— Не сравнивай себя с другими.\n— А если другие лучше?\n— Тем более не сравнивай."},{"k":"joke","t":"Изя что-то ищет под фонарём.\n— Что ты потерял?\n— Ключи.\n— Здесь?\n— Нет, в подворотне.\n— Так почему ищешь здесь?\n— Здесь светлее."},{"k":"joke","t":"Абрам решил больше никогда не спорить с женой и на всё отвечал: «Сара, ты права». Через месяц Сара не выдержала:\n— Абрам, что ты задумал?"},{"k":"joke","t":"Объявление в одесской газете: «Продаётся пианино. Почти новое: сын играл на нём, только когда мама стояла рядом»."},{"k":"joke","t":"— Сара, ты меня слышишь?\n— Абрам, я тебя слышу уже сорок лет."},{"k":"joke","t":"— Хаим, ты бы хотел знать, что будет через десять лет?\n— Зачем? Я и так знаю: мама скажет, что я плохо одет."},{"k":"joke","t":"Ученик Изя на уроке:\n— Марья Ивановна, можно ли наказать человека за то, чего он не делал?\n— Нет, Изя, конечно нельзя.\n— Вот и хорошо. Я не сделал домашнее задание."},{"k":"joke","t":"— Рабинович, вы знаете, что такое невезение?\n— Это когда падаешь на спину, а разбиваешь нос."},{"k":"joke","t":"— Яша, сколько тебе лет?\n— Сорок.\n— Ты же и в прошлом году говорил «сорок»!\n— Я своему слову хозяин."},{"k":"joke","t":"— Доктор, у меня бессонница.\n— Пробовали считать овец?\n— Пробовал. Досчитал до девяноста тысяч, а тут уже и вставать пора."},{"k":"joke","t":"— Абрам, ты почему такой довольный?\n— Был у врача. Он сказал, что с моим здоровьем я проживу долго, если брошу курить, пить и есть сладкое.\n— И чему тут радоваться?\n— Он не сказал, что я обязан бросить."},{"k":"joke","t":"Еврейская мама звонит сыну:\n— Сыночек, я только хотела узнать, жив ли ты. Ну всё, не буду тебя отвлекать от твоей важной жизни."},{"k":"joke","t":"— Сёма, почему ты так долго говоришь с мамой по телефону?\n— Я не говорю. Я слушаю."},{"k":"joke","t":"Встречаются два одессита:\n— Ну, как здоровье?\n— Не дождётесь.\n— А дела?\n— Тоже не дождётесь."},{"k":"joke","t":"— Изя, что ты такой грустный?\n— Сегодня мне исполнилось восемьдесят.\n— Так это же праздник!\n— Вчера мне было семьдесят девять, и я чувствовал себя гораздо моложе."},{"k":"joke","t":"— Мойша, почему ты всегда носишь с собой зонтик?\n— Вдруг пойдёт дождь.\n— А если не пойдёт?\n— Тогда я его не открою."},{"k":"joke","t":"— Сара, купи мне что-нибудь вкусненькое к чаю.\n— Что именно?\n— Я же сказал: что-нибудь! Неужели так трудно догадаться?"},{"k":"joke","t":"— Абрам, у меня для тебя две новости: хорошая и плохая.\n— Начни с хорошей.\n— Хорошей нет."},{"k":"joke","t":"Врач осматривает старого Хаима:\n— Ну, голубчик, вы ещё нас всех переживёте!\n— Доктор, а вы не могли бы записать это в карточку? Вдруг вы забудете."},{"k":"joke","t":"— Изя, ты где был?\n— Ходил к врачу.\n— Ну и что сказал врач?\n— Сказал, что я буду жить. Только не сказал, на что."},{"k":"joke","t":"Еврейская бабушка в поезде:\n— Молодой человек, вы куда едете?\n— В Киев.\n— Ой, а вы ж такой худенький! Возьмите пирожок."},{"k":"joke","t":"— Абрам, скажи честно: ты меня любишь?\n— Сара, я сорок лет ем твой фаршмак. Какие тебе ещё нужны доказательства?"},{"k":"joke","t":"В синагоге у старого еврея пропал зонтик. Раввин советует:\n— В субботу я буду читать десять заповедей. На словах «Не укради» посмотри, кто покраснеет.\nПосле субботы раввин спрашивает:\n— Ну что, нашёл зонтик?\n— Нашёл, ребе. Когда вы дошли до «Не прелюбодействуй», я вспомнил, где его оставил."},{"k":"joke","t":"— Мама, а почему у нас дома столько книг?\n— Чтобы в доме было с кем поговорить, когда папа молчит."},{"k":"joke","t":"Старенький Хаим сидит на скамейке и улыбается.\n— Чему вы улыбаетесь?\n— Вспоминаю молодость.\n— Неужели тогда всё было так хорошо?\n— Не знаю. Плохое я уже забыл."},{"k":"joke","t":"— Абрам, мы с тобой уже старые. Давай вспомним, как мы познакомились.\n— Сара, давай лучше вспомним, куда мы положили очки. Это сейчас важнее."},{"k":"joke","t":"Учитель:\n— Изя, назови пять животных, которые живут в Африке.\n— Три слона и два льва."},{"k":"joke","t":"— Изя, сколько будет дважды два?\n— Четыре.\n— А трижды три?\n— Мама сказала, что на сегодня с меня хватит."},{"k":"joke","t":"Одесса. Женщина спрашивает прохожего:\n— Вы не скажете, как пройти на Дерибасовскую?\n— Знаете что, мадам, идите прямо, а если заблудитесь — спросите. Здесь все знают, и все расскажут, только по-разному."},{"k":"joke","t":"— Ребе, почему у вас всегда такое хорошее настроение?\n— Я каждое утро выбираю: быть счастливым или несчастным. И я выбираю быть счастливым.\n— А если не получается?\n— Тогда я выбираю ещё раз."},{"k":"joke","t":"— Мама, я сдал экзамен на «отлично»!\n— А почему не на «отлично с плюсом»?"},{"k":"joke","t":"Сара перед зеркалом:\n— Абрам, я толстая?\n— Сара, ты — как хорошее вино: с годами только лучше.\n— Значит, всё-таки старая!"},{"k":"joke","t":"Старый еврей учит внука:\n— Запомни: если хочешь, чтобы тебя услышали, говори тихо.\n— Почему, дедушка?\n— Громко говорят все, а тихо — только тот, кому есть что сказать."},{"k":"joke","t":"— Ребе, мне не везёт!\n— А что ты для этого делаешь?\n— Ничего.\n— Ну, видишь: и везение ничего для тебя не делает. Вы квиты."},{"k":"joke","t":"— Сёма, ты почему опоздал?\n— Я-то вышел вовремя. Это время вышло раньше меня."},{"k":"joke","t":"Одесский врач больному:\n— Голубчик, вы пили?\n— Нет.\n— Курили?\n— Нет.\n— Нервничали?\n— Нет.\n— Ну, тогда я не знаю, чем вам помочь, — от здоровья я не лечу!"},{"k":"joke","t":"— Абрам, что ты делаешь?\n— Ничего.\n— А вчера что делал?\n— Тоже ничего.\n— И как, успеваешь?\n— Не очень. Видишь — ещё и сегодня приходится."},{"k":"joke","t":"Два еврея попали на необитаемый остров. Через год их нашли — на острове стояли три синагоги.\n— Зачем вам три?\n— В эту хожу я, в ту — он.\n— А третья?\n— А в третью мы оба ни ногой!"},{"k":"joke","t":"— Сколько еврейских мам нужно, чтобы поменять лампочку?\n— Не надо, не надо, я посижу в темноте…"},{"k":"joke","t":"Еврейский навигатор: «Через триста метров поверните налево. А впрочем, делай как знаешь — ты же никогда маму не слушаешь»."},{"k":"joke","t":"— Вы не знаете, где улица Пушкина?\n— Знаю.\nМолчание.\n— Так что же вы молчите?\n— Вы спросили, знаю ли я. Я ответил."},{"k":"joke","t":"— Изя, ты мог бы прожить без меня?\n— Мог бы.\n— Ах так!\n— Но недолго и плохо."},{"k":"joke","t":"— Изя, сколько тебе лет?\n— Тридцать пять.\n— А выглядишь на тридцать четыре!"},{"k":"joke","t":"— Рабинович, что вы делаете?\n— Пишу письмо самому себе.\n— И что же вы пишете?\n— Откуда я знаю? Я его ещё не получил!"},{"k":"joke","t":"Одесса. Почтальон звонит в дверь:\n— Мадам, у вас все дома?\n— Нет, муж на работе."},{"k":"joke","t":"— Слышали? Шапиро женится!\n— Ему же семьдесят!\n— Так он же не виноват, что любовь пришла так поздно."},{"k":"joke","t":"— Сара, ты почему не спишь?\n— Думаю.\n— О чём?\n— О том, почему я не сплю."},{"k":"joke","t":"Учитель:\n— Изя, что такое бесконечность?\n— Это когда мама говорит по телефону: «Я только на минутку»."},{"k":"joke","t":"Мама — сыну:\n— Моня, не волнуйся, я не буду вмешиваться в твою жизнь.\n— Спасибо, мама.\n— А теперь слушай, что тебе надо делать."},{"k":"saying","t":"Человек предполагает, а Бог смеётся.\n(Идишская поговорка.)"},{"k":"saying","t":"Бог не может быть везде — поэтому он создал мам.\n(Леопольд Комперт, еврейский писатель XIX века; часто приводится как еврейская поговорка.)"},{"k":"saying","t":"Не будь слишком сладким — проглотят; не будь слишком горьким — выплюнут.\n(Идишская поговорка.)"},{"k":"saying","t":"Половина правды — уже целая ложь.\n(Идишская поговорка.)"},{"k":"saying","t":"Дураку не показывают полработы.\n(Идишская поговорка.)"},{"k":"saying","t":"Каждый думает, что его беда — самая тяжёлая. Но если все беды сложить в кучу, каждый взял бы свою.\n(Идишская поговорка.)"},{"k":"saying","t":"Лучше сосед вблизи, нежели брат вдали.\n(Книга Притчей Соломоновых, 27:10)"},{"k":"saying","t":"Если не я за себя, то кто за меня? Но если я только за себя, то кто я? И если не сейчас, то когда?\n(«Пиркей Авот», 1:14)"},{"k":"saying","t":"Кто мудр? Тот, кто учится у каждого. Кто силён? Тот, кто владеет собой. Кто богат? Тот, кто доволен своей долей.\n(«Пиркей Авот», 4:1)"},{"k":"saying","t":"Не суди ближнего, пока не побывал на его месте.\n(«Пиркей Авот», 2:4)"},{"k":"saying","t":"Поживём — доживём.\n(Идишская поговорка: «Аз мен лебт, дэрлебт мен».)"},{"k":"saying","t":"Гость — как дождь: когда он затягивается, становится в тягость.\n(Идишская поговорка.)"},{"k":"saying","t":"С ложью далеко уйдёшь, да назад не вернёшься.\n(Идишская поговорка.)"},{"k":"saying","t":"Из твоих уст — да Богу в уши.\n(Идишская поговорка.)"},{"k":"saying","t":"Когда надо — тогда и можешь.\n(Идишская поговорка.)"},{"k":"saying","t":"Бог посылает лекарство раньше, чем болезнь.\n(Идишская поговорка.)"}],"tasks":[{"t":"Придумайте пять необычных способов использовать канцелярскую скрепку.","e":["закладка в книге","крючок для ёлочной игрушки","ключ для лотка сим-карты","держатель для кабеля","указатель конца на рулоне скотча"]},{"t":"Придумайте пять необычных способов использовать старую газету.","e":["вытереть окна до блеска","набить мокрую обувь, чтобы просохла","бумажная шляпа от солнца","растопка для печки","упаковка для посуды при переезде"]},{"t":"Представьте свою кухню из детства. Назовите пять предметов, которые там стояли, и вспомните пять запахов.","e":["самовар или чайник","буфет","клеёнка на столе","запах пирогов","запах печки"]},{"t":"Придумайте пять способов использовать пустую стеклянную банку.","e":["ваза для цветов","подсвечник","копилка","хранилище для пуговиц","«аквариум» для черенков"]},{"t":"Представьте, что вы стали ростом с муравья и идёте по своей комнате. Опишите, что вы видите по дороге от двери до окна.","e":["ворсинки ковра как трава","ножка стула как колонна","крошка хлеба как валун","пылинки в солнечном луче"]},{"t":"Назовите десять предметов круглой формы, которые есть у вас дома.","e":["тарелка","пуговица","часы","колёсико от кресла","монета","крышка кастрюли","плафон","кольцо","мяч","апельсин"]},{"t":"Придумайте название для нового пирожного и опишите, как оно выглядит.","e":["«Летний вечер» — бисквит с малиной под белой глазурью","«Бабушкин сад» — песочная корзиночка с яблоками"]},{"t":"Что было бы, если бы у людей не было часов? Назовите пять последствий.","e":["встречались бы «на рассвете»","поезда ходили бы «по солнцу»","больше спали бы зимой","ценили бы петухов","опаздывать было бы невозможно"]},{"t":"Придумайте пять способов использовать зонт, кроме защиты от дождя.","e":["тень на пляже","трость","достать мяч с дерева","сушилка дл const ORD = {};

function itemOf(pool, list, S, n = 1, k = 0) { const o = orderOf(pool, list); return list[o[((S - 1) * n + k) % o.length]]; }

const latinOf = S => itemOf('latin', D.latin, S);
const wordOf = S => itemOf('word', D.words, S);
const puzzleOf = S => itemOf('puzzle', D.puzzles, S);

function memoWords(S) {

  for (const c of cats) { const ws = shuffled(D.mem[c], r); show.push(ws[0]); extra.push(ws[1]); }

}

/* =====================================================================
   drills.js — упражнения на внимание, память и воображение.
   Каждое упражнение: U[kind](c, done); done({ok, total, value, line}) вызывается после кнопки «Дальше».
   c = {S, mode, title, icon, sub, rng, i, n}
   ===================================================================== */
const U = {};
const tagHtml = c => `<div class="tag"><span class="ic">${ICON[c.icon] || ''}</span><span><b>${esc(c.title)}</b>${c.sub ? ' · ' + esc(c.sub) : ''}${c.n > 1 ? ' · ' + (c.i + 1) + ' из ' + c.n : ''}</span><button class="skip" id="skip">пропустить</button></div>`;
function stage(c, html) {
  APP.innerHTML = `<div class="stage">${tagHtml(c)}${html}</div>`; window.scrollTo(0, 0);
  const s = $('#skip'); if (s) s.onclick = () => { clearTimers(); KEY = null; c.skipped(); };
}
// карточка с итогом и кнопкой «Дальше»
function finish(c, html, res, done, cls = 'ok', label = 'Готово') {
  const st = $('.stage'); st.insertAdjacentHTML('beforeend', `${html == null ? '' : `<div class="card ${cls}"><span class="v">${esc(label)}</span>${html}</div>`}<div class="foot"><button class="btn pri" id="next">Дальше <kbd>Enter</kbd></button></div>`);
  const go = () => { KEY = null; clearTimers(); done(Object.assign({ ok: 0, total: 0, value: '', line: '' }, res)); };
  $('#next').onclick = go; $('#next').focus({ preventScroll: true });
  KEY = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  later(30, () => { const n = $('#next'); if (n && n.getBoundingClientRect().bottom > innerHeight) n.scrollIntoView({ behavior: 'smooth', block: 'end' }); });
}
function intro(c, title, text, start, btn = 'Начать') {
  stage(c, `<div class="q">${title}</div><div class="sub" style="font-size:1rem">${text}</div><div class="foot"><button class="btn pri" id="go">${btn} <kbd>Enter</kbd></button></div>`);
  const go = () => { KEY = null; start(); };
  $('#go').onclick = go; $('#go').focus({ preventScroll: true });
  KEY = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
}
// вопрос с вариантами; o.options[0] — верный
function mcq(c, o, done) {
  const opts = shuffled(o.options.map((t, i) => ({ t, ok: i === 0 })), c.rng);
  stage(c, `${o.prompt}<div class="opts">${opts.map((x, i) => `<button class="opt ${o.cls || ''}" data-o="${i}"><span class="k">${i + 1}</span><span>${o.raw ? x.t : esc(x.t)}</span></button>`).join('')}</div>`);
  let over = false;
  const pickO = i => {
    if (over || !opts[i]) return; over = true; const ok = opts[i].ok;
    $$('.opt').forEach((b, k) => { b.disabled = true; b.classList.add(opts[k].ok ? 'right' : k === i ? 'wrong' : 'dim'); });
    if (o.after) o.after(ok);
    else finish(c, o.explain(ok), { ok: ok ? 1 : 0, total: 1, line: o.line || '' }, done, ok ? 'ok' : 'no', ok ? 'Верно' : 'Не совсем');
  };
  $('.opts').onclick = e => { const b = e.target.closest('.opt'); if (b) pickO(+b.dataset.o); };
  KEY = e => { if (/^[1-9]$/.test(e.key)) { e.preventDefault(); pickO(+e.key - 1); } };
}
// цифровая клавиатура на экране (крупные кнопки; клавиатура телефона не нужна)
function keypad(onOk, maxLen = 12) {
  let val = '';
  const html = `<div class="entry" id="entry">&nbsp;</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-d="${d}">${d}</button>`).join('')}<button data-d="del" aria-label="Стереть">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">ОК</button></div>`;
  const bind = () => {
    const show = () => { $('#entry').textContent = val || ' '; };
    const press = d => { if (d === 'del') val = val.slice(0, -1); else if (d === 'ok') { if (val) { KEY = null; onOk(val); } return; } else if (val.length < maxLen) val += d; show(); };
    $('.pad').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.d); };
    KEY = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') { e.preventDefault(); press('ok'); } };
  };
  return { html, bind };
}

/* ---------- 1. Запомните слова (вспоминаем в конце) ---------- */
U.memo = (c, done) => {
  const { show } = memoWords(c.S);
  stage(c, `<div class="q">Запомните десять слов</div><div class="sub" style="font-size:1rem">Прочитайте их вслух и представьте каждый предмет — так запоминается лучше. В конце зарядки мы их вспомним.</div>
    <div class="chips">${show.map(w => `<span>${esc(w)}</span>`).join('')}</div>${sayBtn(show.join(', '))}`);
  finish(c, null, { value: '10 слов' }, done);
  $('#next').innerHTML = 'Я постараюсь запомнить <kbd>Enter</kbd>';
};
U.recall = (c, done) => {
  const { show, extra } = memoWords(c.S), was = new Set(show), all = shuffled([...show, ...extra], c.rng), sel = new Set();
  stage(c, `<div class="q">Вспомните слова из начала зарядки</div><div class="sub" style="font-size:1rem">Сначала попробуйте назвать их вслух по памяти. Потом отметьте в списке те десять, что были.</div>
    <div class="chips">${all.map((w, i) => `<button data-i="${i}" aria-pressed="false">${esc(w)}</button>`).join('')}</div><div class="foot" id="act"><button class="btn pri" id="chk">Проверить <kbd>Enter</kbd></button><span class="hint" id="cnt">Отмечено: 0</span></div>`);
  $('.chips').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); b.setAttribute('aria-pressed', sel.has(i)); $('#cnt').textContent = 'Отмечено: ' + sel.size; };
  const check = () => {
    let hit = 0, fa = 0;
    all.forEach((w, i) => { const b = $(`.chips [data-i="${i}"]`); b.disabled = true; if (was.has(w) && sel.has(i)) { hit++; b.classList.add('ok'); } else if (sel.has(i)) { fa++; b.classList.add('no'); } else if (was.has(w)) b.classList.add('miss'); });
    $('#act').remove(); const score = Math.max(0, hit - fa), rec = score > (BEST.recall || 0); if (rec) { BEST.recall = score; saveBest(); }
    finish(c, `Узнано ${hit} из 10${fa ? `, лишних — ${fa}` : ''}.${rec && c.S > 1 ? ' Это ваш лучший результат!' : ''}<br><span class="hint">Пунктиром обведены слова, которые были, но не отмечены.</span>`, { ok: score, total: 10, value: `${hit} из 10` }, done, hit >= 8 ? 'ok' : 'warm', 'Итог');
  };
  $('#chk').onclick = check; KEY = e => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
};

U.schulte = (c, done) => {
